<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f17">
  <title>AMM Mission Editor</title>
  <style>
    :root {
      --bg-app: #0b0f17;
      --bg-panel: #111827;
      --bg-elevated: #1b2434;
      --bg-input: #0e1420;
      --border-default: #2b394e;
      --border-strong: #3b4d68;
      --text-primary: #e5edf7;
      --text-muted: #94a3b8;
      --accent: #22d3ee;
      --accent-cyan: #22d3ee;
      --accent-amber: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-violet: #a78bfa;
      --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      --focus-ring: 0 0 0 2px #0b0f17, 0 0 0 4px var(--accent);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html {
      color-scheme: dark;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.4;
    }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg-app);
      color: var(--text-primary);
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button, input, select, textarea {
      font: inherit;
      color: var(--text-primary);
    }
    button {
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      user-select: none;
      touch-action: manipulation;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }
    button:hover:not(:disabled) {
      background: #233044;
      border-color: var(--border-strong);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.btn-primary {
      background: #0e7490;
      border-color: #22d3ee;
      color: #f0fdff;
      font-weight: 600;
    }
    button.btn-primary:hover:not(:disabled) { background: #0891b2; }
    button.btn-danger {
      background: #451a1d;
      border-color: #ef4444;
      color: #fecaca;
    }
    input[type="text"], input[type="number"], select, textarea {
      background: var(--bg-input);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      padding: 5px 8px;
      color: var(--text-primary);
      min-width: 0;
    }
    select {
      appearance: none;
      background-color: var(--bg-input);
      padding-right: 24px;
      color-scheme: dark;
    }
    select option {
      background: var(--bg-panel);
      color: var(--text-primary);
    }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .tabular { font-variant-numeric: tabular-nums; }
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      min-width: 0;
    }
    .top-header {
      height: 52px;
      flex: 0 0 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-default);
      user-select: none;
      min-width: 0;
    }
    .brand-pill {
      padding: 4px 8px;
      border-radius: 5px;
      background: #0e749033;
      border: 1px solid #22d3ee66;
      color: var(--accent-cyan);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .segmented {
      display: inline-flex;
      border: 1px solid var(--border-default);
      border-radius: 6px;
      overflow: hidden;
    }
    .segmented button {
      border: 0;
      border-radius: 0;
      padding: 4px 10px;
      background: var(--bg-input);
    }
    .segmented button[aria-pressed="true"], .segmented button.active {
      background: #0e7490;
      color: #f0fdff;
      font-weight: 600;
    }
    .header-spacer { flex: 1 1 auto; min-width: 0; }
    .toast-banner {
      padding: 4px 10px;
      border-radius: 6px;
      background: #0f293a;
      border: 1px solid var(--accent-cyan);
      font-size: 12px;
      max-width: 340px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .toast-banner.warn { background: #3b2608; border-color: var(--accent-amber); }
    .toast-banner.error { background: #3d1216; border-color: var(--accent-red); }
    .workspace-main {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }
    #leftRail {
      width: 300px;
      flex: 0 0 300px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-default);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      position: relative;
    }
    .rail-header {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .rail-title { font-weight: 700; font-size: 12px; flex: 1 1 auto; }
    .cp-list {
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .cp-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 7px;
      padding: 6px 8px;
      min-width: 0;
    }
    .cp-row.selected {
      border-color: var(--accent-amber);
      background: #20293d;
    }
    .cp-row-top {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .cp-select-btn {
      flex: 1 1 auto;
      min-width: 0;
      justify-content: flex-start;
      text-align: left;
      background: transparent;
      border: 0;
      padding: 2px 4px;
    }
    .cp-select-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.04); }
    .cp-actions-mini { display: flex; gap: 3px; }
    .cp-actions-mini button { padding: 2px 5px; font-size: 11px; }
    .cp-summary { font-size: 11px; color: var(--text-muted); padding-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 4px; padding-left: 4px; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      background: #1e293b;
      border: 1px solid var(--border-default);
      color: var(--text-primary);
    }
    .badge.warn { background: #3b2608; border-color: var(--accent-amber); color: #fde68a; }
    .badge.err { background: #3d1216; border-color: var(--accent-red); color: #fecaca; }
    .badge.mac { background: #2e1d47; border-color: var(--accent-violet); color: #e9d5ff; }
    .popover-panel {
      position: absolute;
      top: 46px;
      left: 8px;
      right: 8px;
      max-height: 75%;
      z-index: 30;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .picker-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-default);
    }
    .picker-list {
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .picker-item {
      width: 100%;
      justify-content: space-between;
      text-align: left;
      padding: 6px 8px;
      background: var(--bg-elevated);
    }
    #centerColumn {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-app);
    }
    .canvas-stage {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      user-select: none;
    }
    #missionCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      user-select: none;
    }
    .canvas-overlay-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid var(--border-default);
      border-radius: 7px;
      padding: 4px 8px;
      user-select: none;
    }
    .empty-cta {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 340px;
      height: fit-content;
      padding: 18px;
      background: rgba(17, 24, 39, 0.94);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .empty-cta[hidden] { display: none; }
    #altProfilePane {
      height: 120px;
      flex: 0 0 120px;
      border-top: 1px solid var(--border-default);
      background: #0f1522;
      position: relative;
      user-select: none;
    }
    #altProfilePane[hidden] { display: none; }
    #altProfileCanvas { width: 100%; height: 100%; display: block; cursor: ns-resize; }
    #rightInspector {
      width: 420px;
      flex: 0 0 420px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-default);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .inspector-head {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .inspector-body {
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }
    .inspector-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border-default);
      padding-bottom: 6px;
    }
    .inspector-tabs button[aria-selected="true"] {
      background: #0e7490;
      border-color: var(--accent-cyan);
      color: #f0fdff;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      min-width: 0;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }
    .field-group.full { grid-column: 1 / -1; }
    .field-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .section-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 7px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    details.precond-group summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      padding: 3px 0;
      user-select: none;
    }
    #rawJsonDrawer {
      position: fixed;
      top: 52px;
      right: 0;
      bottom: 32px;
      width: 460px;
      max-width: 100vw;
      z-index: 40;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-strong);
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
      overscroll-behavior: contain;
      box-shadow: -10px 0 28px rgba(0, 0, 0, 0.6);
    }
    #rawJsonDrawer[hidden] { display: none; }
    #rawJsonTextarea {
      flex: 1 1 auto;
      width: 100%;
      resize: none;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.45;
    }
    .bottom-validation-bar {
      flex: 0 0 auto;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-default);
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    .validation-strip {
      height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
    }
    .validation-list {
      height: 133px;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px 12px;
      border-top: 1px solid var(--border-default);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .validation-list[hidden] { display: none; }
    .val-issue-btn {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      font-size: 12px;
      padding: 4px 8px;
    }
    @media (pointer: fine) {
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
    }
    @media (max-width: 1150px) {
      .workspace-main { flex-direction: column; overflow-y: auto; }
      #leftRail, #rightInspector { width: 100%; flex: 0 0 auto; max-height: 40vh; border: 0; border-bottom: 1px solid var(--border-default); }
      .canvas-stage { min-height: 320px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <span class="brand-pill">AMM v2.0.0</span>
      <label for="missionIdInput" class="field-label">Mission ID</label>
      <input id="missionIdInput" type="text" class="mono" style="width:150px" aria-label="Mission ID" data-field-path="missionId">
      <div class="segmented" role="group" aria-label="Execution mode">
        <button id="execModeSingle" type="button" aria-pressed="true">SINGLE</button>
        <button id="execModeRepeat" type="button" aria-pressed="false">REPEAT</button>
      </div>
      <button id="btnUndo" type="button" title="Ctrl+Z">Undo</button>
      <button id="btnRedo" type="button" title="Ctrl+Y">Redo</button>
      <select id="presetSelect" aria-label="Load mission preset">
        <option value="">Presets…</option>
        <option value="MSN_RECON_001">MSN_RECON_001 (Recon Orbit)</option>
        <option value="MSN_TRANSIT_CORRIDOR">MSN_TRANSIT_CORRIDOR (Corridor)</option>
        <option value="MSN_PRECISION_DELIVERY">MSN_PRECISION_DELIVERY (Delivery)</option>
      </select>
      <input id="fileImportInput" type="file" accept=".json,application/json" hidden>
      <button id="btnImportJson" type="button">Import .json</button>
      <button id="btnRawJson" type="button" aria-expanded="false" aria-controls="rawJsonDrawer">Raw JSON</button>
      <button id="btnCopyJson" type="button">Copy JSON</button>
      <button id="btnExportJson" type="button" class="btn-primary">Export .json</button>
      <div class="header-spacer"></div>
      <div id="toastBanner" class="toast-banner" role="status" aria-live="polite" hidden></div>
    </header>

    <main class="workspace-main">
      <aside id="leftRail" aria-label="Checkpoints">
        <div class="rail-header">
          <span class="rail-title">Checkpoints <span id="cpCountBadge" class="badge tabular">0</span></span>
          <button id="btnOpenAddPicker" type="button" class="btn-primary">+ Add</button>
          <button id="btnOpenMacroPicker" type="button">+ Macro</button>
        </div>
        <div id="actionPickerPopover" class="popover-panel" hidden>
          <div class="rail-header">
            <input id="pickerSearch" type="text" placeholder="Search ACT_*, MAC_*, keyword…" aria-label="Search actions" style="flex:1 1 auto">
            <button id="btnClosePicker" type="button" aria-label="Close action picker">✕</button>
          </div>
          <div id="pickerDomainTabs" class="picker-tabs" role="tablist" aria-label="Action domains"></div>
          <div id="pickerList" class="picker-list"></div>
        </div>
        <div id="cpList" class="cp-list"></div>
      </aside>

      <section id="centerColumn" aria-label="Mission 2D Map">
        <div class="canvas-stage">
          <canvas id="missionCanvas"></canvas>
          <div class="canvas-overlay-bar">
            <button id="btnToggleSnap" type="button" aria-pressed="true">Snap 10m</button>
            <button id="btnFitView" type="button">Fit</button>
            <button id="btnToggleAltProfile" type="button" aria-expanded="false" aria-controls="altProfilePane">Alt Profile</button>
            <span id="zoomReadout" class="mono tabular" style="font-size:11px;color:var(--text-muted)">100%</span>
          </div>
          <div id="emptyCanvasCta" class="empty-cta">
            <strong>Empty AMM v2.0.0 Draft</strong>
            <span style="color:var(--text-muted);font-size:12px">Start from a sample sortie or place the first checkpoint.</span>
            <div style="display:flex;gap:8px;justify-content:center">
              <button id="btnEmptyPreset" type="button" class="btn-primary">Load MSN_RECON_001</button>
              <button id="btnEmptyAdd" type="button">+ Add First Checkpoint</button>
            </div>
          </div>
        </div>
        <div id="altProfilePane" hidden>
          <canvas id="altProfileCanvas"></canvas>
        </div>
      </section>

      <aside id="rightInspector" aria-label="Inspector">
        <div class="inspector-head">
          <div class="segmented" role="group" aria-label="Inspector mode" style="width:100%">
            <button id="modeCheckpointBtn" type="button" aria-pressed="true" style="flex:1 1 50%;justify-content:center">Checkpoint</button>
            <button id="modeSettingsBtn" type="button" aria-pressed="false" style="flex:1 1 50%;justify-content:center">Mission Settings</button>
          </div>
        </div>
        <div id="inspectorBody" class="inspector-body"></div>
      </aside>
    </main>

    <aside id="rawJsonDrawer" aria-label="Raw JSON Drawer" hidden>
      <div class="rail-header" style="padding:0 0 8px 0">
        <strong style="flex:1 1 auto">Raw AMM v2.0.0 JSON</strong>
        <button id="btnFormatJson" type="button">Format</button>
        <button id="btnApplyJson" type="button" class="btn-primary">Apply JSON</button>
        <button id="btnCloseRawJson" type="button">Close</button>
      </div>
      <textarea id="rawJsonTextarea" aria-label="Raw mission JSON"></textarea>
    </aside>

    <footer id="validationBar" class="bottom-validation-bar">
      <div class="validation-strip">
        <span id="validationSummary" class="mono tabular" style="flex:1 1 auto">0 Errors · 0 Warnings</span>
        <div class="segmented" role="group" aria-label="Validation severity filter">
          <button id="valFilterAll" type="button" aria-pressed="true">All</button>
          <button id="valFilterErrors" type="button" aria-pressed="false">Errors</button>
          <button id="valFilterWarnings" type="button" aria-pressed="false">Warnings</button>
        </div>
        <button id="btnToggleValidation" type="button" aria-expanded="false" aria-controls="validationList">Details</button>
      </div>
      <div id="validationList" class="validation-list" hidden></div>
    </footer>
  </div>
  <script>
    "use strict";
    (() => {
      const deepClone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
      const isFiniteNum = (n) => typeof n === "number" && Number.isFinite(n);
      const isPosXZ = (p) => Boolean(p && typeof p === "object" && isFiniteNum(p.x) && isFiniteNum(p.z));

      const SchemaConstants = (() => {
        const DEFAULTS_BASELINE = {
          cruiseSpeed: 18.0,
          targetAlt: 150.0,
          acceptanceRadius: 15.0,
          headingMode: "AUTO",
        };
        const EXECUTION_MODES = ["SINGLE", "REPEAT"];
        const FALLBACK_POLICIES = ["RTH", "HOVER_HOLD", "LOITER", "SKIP_NEXT"];
        const HEADING_MODES = ["AUTO", "FIXED", "POI"];
        const AIRFRAME_TYPES = ["WINGED_VTOL", "MULTICOPTER", "FIXED_WING"];
        const REDSTONE_SIDES = ["top", "bottom", "left", "right", "front", "back"];
        const BUNDLED_COLORS = [
          { key: "white", hex: "#F0F0F0" },
          { key: "orange", hex: "#F2B233" },
          { key: "magenta", hex: "#E57FD8" },
          { key: "lightBlue", hex: "#99B2F2" },
          { key: "yellow", hex: "#DEDE6C" },
          { key: "lime", hex: "#7FCC19" },
          { key: "pink", hex: "#F2B2CC" },
          { key: "gray", hex: "#4C4C4C" },
          { key: "lightGray", hex: "#999999" },
          { key: "cyan", hex: "#4C99B2" },
          { key: "purple", hex: "#B266E5" },
          { key: "blue", hex: "#3366CC" },
          { key: "brown", hex: "#7F664C" },
          { key: "green", hex: "#57A64E" },
          { key: "red", hex: "#CC4C4C" },
          { key: "black", hex: "#111111" },
        ];

        const ACTIVE_ACTIONS = {
          ACT_SYS_LOAD: { domain: "SYS", label: "Load Mission", summary: "미션 적재 및 초기화 (MANUAL)", spatial: false },
          ACT_SYS_PREFLIGHT: { domain: "SYS", label: "Preflight Check", summary: "비행 전 자가 점검 (MANUAL)", spatial: false },
          ACT_SYS_SET_HOME: { domain: "SYS", label: "Set Home", summary: "현재/지정 위치를 귀환 원점으로 기록", spatial: false },
          ACT_SYS_ARM: { domain: "SYS", label: "Arm Motors", summary: "추진 계통 시동 (IMMEDIATE)", spatial: false },
          ACT_SYS_DISARM: { domain: "SYS", label: "Disarm Motors", summary: "추진 계통 정지 (IMMEDIATE)", spatial: false },
          ACT_SYS_TERMINATE: { domain: "SYS", label: "Terminate Mission", summary: "임무 즉시 종료 (E-STOP)", spatial: false },

          ACT_TKL_TAKEOFF_VERT: { domain: "TKL", label: "Vertical Takeoff", summary: "수직 이륙 (목표 고도 도달 시 완료)", spatial: true, optionalPos: true },
          ACT_TKL_TRANS_MC2FW: { domain: "TKL", label: "Transition MC->FW", summary: "멀티콥터에서 고정익 천이", spatial: false },

        };

        const resolveZone3Channel = (offsetOrChannel, baseCh) => {
          const val = Number(offsetOrChannel);
          if (!Number.isInteger(val)) return null;
          if (val >= 20 && val <= 29) return (baseCh || 10000) + val;
          return val;
        };

          const def = Object.assign({}, SchemaConstants.DEFAULTS_BASELINE, missionDefaults || {});

          const act = cp && cp.action;
          const isGoto = act === "ACT_NAV_GOTO_WP" || act === "ACT_NAV_CORRIDOR";

            targetAlt: isFiniteNum(p.targetAlt) ? p.targetAlt : def.targetAlt,
            cruiseSpeed: isFiniteNum(p.cruiseSpeed) ? p.cruiseSpeed : def.cruiseSpeed,
            acceptanceRadius: isFiniteNum(p.acceptanceRadius)
              ? p.acceptanceRadius
              : (isGoto ? 5.0 : def.acceptanceRadius),
            headingMode: p.headingMode || (act === "ACT_PAT_POI_HOLD" ? "POI" : def.headingMode),
            settleTicks: act === "ACT_NAV_SPLINE_WP" ? 0 : 4,
          };
        };

        const describeDefaultComplete = (cp, defaults) => {
          if (!cp) return "";
          const r = resolveCheckpointDefaults(cp, defaults);
          const p = cp.params || {};
          const a = cp.action;
          if (a === "ACT_NAV_SPLINE_WP") return `PROXIMITY_2D (toleranceM: ${r.acceptanceRadius}m, settleTicks: 0)`;
          if (a === "ACT_NAV_GOTO_WP" || a === "ACT_NAV_CORRIDOR") return `PROXIMITY_3D (toleranceM: ${r.acceptanceRadius}m, settleTicks: 4)`;
          if (a === "ACT_TKL_TAKEOFF_VERT" || a === "ACT_NAV_CHANGE_ALT" || a === "ACT_PAT_LOITER_ALT") return "ALTITUDE_REACHED (toleranceM: 5.0m, settleTicks: 4)";
          if (a === "ACT_TKL_LAND_NORM" || a === "ACT_TKL_LAND_PREC") return `FACILITY_TOUCHDOWN (${p.facilityId || "PAD"})`;
          if (a === "ACT_PAT_LOITER_TIME" || a === "ACT_PAT_HOLD_POS" || a === "ACT_PAT_POI_HOLD") {
            return isFiniteNum(p.durationSec) ? `DURATION_SEC (${p.durationSec}s)` : "Manual hold (next/stop)";
          }
          if (a === "ACT_PAY_BUS_CMD" || a === "ACT_PAY_SET_ROI" || a === "ACT_PAY_CLEAR_ROI") {
            return p.waitForAck === false ? "IMMEDIATE (waitForAck=false)" : "PAYLOAD_RESP_MATCH (ACK)";

            return p.mode === "WAIT_INPUT" ? "REDSTONE_INPUT_HIGH" : `DURATION_SEC (${((p.durationMs || 0) / 1000).toFixed(2)}s)`;

          return "Runtime action lifecycle default";

        return { computeBaseChannel, resolveZone3Channel, resolveCheckpointDefaults, describeDefaultComplete };

      const MacroExpander = (() => {
        const normalizeShortcutCoords = (params) => {
          if (!params || typeof params !== "object") return {};
          const out = deepClone(params);
          if (!out.targetPos && isFiniteNum(out.x) && isFiniteNum(out.z)) {
            out.targetPos = { x: out.x, z: out.z };
            delete out.x;
            delete out.z;
          }
          return out;
        };

        const extractExtras = (obj, knownKeys) => {
          if (!obj || typeof obj !== "object" || Array.isArray(obj)) return undefined;
          const known = new Set(knownKeys);
          const extra = {};
          let count = 0;
          for (const [k, v] of Object.entries(obj)) {
            if (!known.has(k) && k !== "_extra") {
              extra[k] = deepClone(v);
              count += 1;
            }
          }
          return count > 0 ? extra : undefined;
        };

        const mergeExtras = (target, extraMap) => {
          if (!extraMap || typeof extraMap !== "object") return target;
          const out = Object.assign({}, target);
          for (const [k, v] of Object.entries(extraMap)) {
            if (!(k in out)) out[k] = deepClone(v);
          }
          return out;
        };

        const SHARED_PARAM_KEYS = new Set(["targetPos", "targetAlt", "cruiseSpeed"]);
        const cleanActionSwitchParams = (oldParams, nextAction) => {
          const prev = oldParams && typeof oldParams === "object" ? oldParams : {};
          const out = {};
          const meta = SchemaConstants.ACTIVE_ACTIONS[nextAction] || SchemaConstants.MACRO_META[nextAction];
          const allowSpatial = !meta || meta.spatial !== false || meta.optionalPos;
          if (allowSpatial && isPosXZ(prev.targetPos)) out.targetPos = deepClone(prev.targetPos);
          if (isFiniteNum(prev.targetAlt)) out.targetAlt = prev.targetAlt;
          if (isFiniteNum(prev.cruiseSpeed)) out.cruiseSpeed = prev.cruiseSpeed;
          if (nextAction === "ACT_NAV_CORRIDOR") {
            out.startPos = isPosXZ(prev.startPos) ? deepClone(prev.startPos) : { x: 0, z: 0 };
            out.endPos = isPosXZ(prev.endPos) ? deepClone(prev.endPos) : (out.targetPos ? deepClone(out.targetPos) : { x: 200, z: 0 });
            out.maxCrossTrackM = isFiniteNum(prev.maxCrossTrackM) ? prev.maxCrossTrackM : 15.0;
          } else if (nextAction && nextAction.startsWith("ACT_PAT_LOITER_")) {
            out.radius = isFiniteNum(prev.radius) ? prev.radius : 30.0;
            out.direction = prev.direction === "CCW" ? "CCW" : "CW";
            if (nextAction === "ACT_PAT_LOITER_TURNS") out.turns = isFiniteNum(prev.turns) ? prev.turns : 2;
          } else if (nextAction === "ACT_PAT_POI_HOLD" || nextAction === "ACT_PAY_SET_ROI") {
            out.poiPos = isPosXZ(prev.poiPos) ? deepClone(prev.poiPos) : { x: 0, z: 0 };
          } else if (nextAction === "ACT_PAY_BUS_CMD") {
            out.channelOffset = Number.isInteger(prev.channelOffset) ? prev.channelOffset : 20;
            out.command = typeof prev.command === "string" && prev.command ? prev.command : "CAPTURE";
            out.commandPayload = prev.commandPayload && typeof prev.commandPayload === "object" ? deepClone(prev.commandPayload) : {};
            out.waitForAck = prev.waitForAck !== false;
            out.expectedStatus = typeof prev.expectedStatus === "string" && prev.expectedStatus ? prev.expectedStatus : "OK";
          } else if (nextAction === "ACT_PAY_REDSTONE") {
            out.mode = prev.mode === "WAIT_INPUT" ? "WAIT_INPUT" : "EMIT";
            out.side = SchemaConstants.REDSTONE_SIDES.includes(prev.side) ? prev.side : "bottom";
            out.state = prev.state !== false;
            out.durationMs = isFiniteNum(prev.durationMs) ? prev.durationMs : 500;
          } else if (nextAction === "MAC_RECON_ORBIT") {
            out.radius = isFiniteNum(prev.radius) ? prev.radius : 40;
            out.durationSec = isFiniteNum(prev.durationSec) ? prev.durationSec : 60;
          } else if (nextAction === "MAC_CARGO_SORTIE") {
            out.channelOffset = Number.isInteger(prev.channelOffset) ? prev.channelOffset : 20;
            out.command = typeof prev.command === "string" && prev.command ? prev.command : "DROP_CARGO";
            out.payload = prev.payload && typeof prev.payload === "object" ? deepClone(prev.payload) : {};
            out.awaitAck = prev.awaitAck !== false;
          }
          for (const k of Object.keys(prev)) {
            if (!SHARED_PARAM_KEYS.has(k) && k === "facilityId" && (nextAction.startsWith("ACT_TKL_") || nextAction.startsWith("ACT_MOB_") || nextAction.startsWith("MAC_"))) {
              out.facilityId = prev.facilityId;
            }
          }
          return out;
        };

        const mergeDecorators = (baseList, extraList) => {
          const merged = [];
          for (const d of baseList || []) merged.push(deepClone(d));
          for (const d of extraList || []) merged.push(deepClone(d));
          return merged.length > 0 ? merged : undefined;
        };

        const makeStep = (baseCp, idx, action, params, defaultDecs, carryPreconditions) => {
          const idPrefix = String((baseCp && baseCp.checkpointId) || "CP");
          const step = {
            checkpointId: `${idPrefix}_${idx}`,
            action,
            params: deepClone(params || {}),
          };
          if (carryPreconditions && baseCp && baseCp.preconditions) {
            step.preconditions = deepClone(baseCp.preconditions);
          }
          const decs = mergeDecorators(defaultDecs, baseCp && baseCp.decorators);
          if (decs) step.decorators = decs;
          if (idx === 1 && baseCp) {
            if (Array.isArray(baseCp.onEnter) && baseCp.onEnter.length) step.onEnter = deepClone(baseCp.onEnter);
            if (Array.isArray(baseCp.onExit) && baseCp.onExit.length) step.onExit = deepClone(baseCp.onExit);
            if (Array.isArray(baseCp.onAbort) && baseCp.onAbort.length) step.onAbort = deepClone(baseCp.onAbort);
          }
          return step;
        };

        const expandMacroCheckpoint = (cp, airframeType) => {
          if (!cp || typeof cp !== "object") return [];
          const p = cp.params || {};
          if (cp.action === "MAC_RECON_ORBIT") {
            const radius = isFiniteNum(p.radius) ? p.radius : 40;
            const poiPos = p.poiPos ? deepClone(p.poiPos) : deepClone(p.targetPos);
            return [
              makeStep(cp, 1, "ACT_NAV_GOTO_WP", { targetPos: p.targetPos, targetAlt: p.targetAlt, tangentEntryOffsetM: radius }, null, true),
              makeStep(cp, 2, "ACT_PAY_SET_ROI", { poiPos }, null, false),
              makeStep(cp, 3, "ACT_PAT_LOITER_TIME", { targetPos: p.targetPos, targetAlt: p.targetAlt, radius, durationSec: isFiniteNum(p.durationSec) ? p.durationSec : 60 }, [{ decoratorId: "DEC_SMOOTH_TRAJ" }], false),
              makeStep(cp, 4, "ACT_PAY_CLEAR_ROI", {}, null, false),
              makeStep(cp, 5, "ACT_FS_RTL_HOME", { targetAlt: p.targetAlt }, [{ decoratorId: "DEC_ENERGY_ECO" }], false),
              makeStep(cp, 6, "ACT_TKL_LAND_PREC", { facilityId: p.facilityId, targetPos: p.targetPos }, null, false),
            ];
          }
          if (cp.action === "MAC_SHIP_RECOVERY") {
            const retryDec = [{ decoratorId: "DEC_RETRY_N", overrideParams: { maxAttempts: 3 } }];
            const steps = [
              makeStep(cp, 1, "ACT_MOB_RV_TRACK", { facilityId: p.facilityId, targetPos: p.targetPos }, null, true),
            ];
            if (airframeType === "WINGED_VTOL") {
              steps.push(makeStep(cp, steps.length + 1, "ACT_TKL_TRANS_FW2MC", {}, null, false));
            }
            steps.push(makeStep(cp, steps.length + 1, "ACT_MOB_DECK_SYNC", { facilityId: p.facilityId, targetPos: p.targetPos }, null, false));
            steps.push(makeStep(cp, steps.length + 1, "ACT_TKL_LAND_PREC", { facilityId: p.facilityId, targetPos: p.targetPos }, retryDec, false));
            steps.push(makeStep(cp, steps.length + 1, "ACT_SYS_DISARM", {}, null, false));
            return steps;
          }
          if (cp.action === "MAC_CARGO_SORTIE") {
            return [
              makeStep(cp, 1, "ACT_TKL_TAKEOFF_VERT", { facilityId: p.facilityId, targetAlt: p.targetAlt }, null, true),
              makeStep(cp, 2, "ACT_NAV_GOTO_WP", { targetPos: p.targetPos, targetAlt: p.targetAlt }, null, false),
              makeStep(cp, 3, "ACT_PAY_BUS_CMD", { channelOffset: p.channelOffset, command: p.command, payload: p.payload, awaitAck: p.awaitAck }, [{ decoratorId: "DEC_HUMAN_AUTH" }], false),
              makeStep(cp, 4, "ACT_FS_RTL_HOME", { targetAlt: p.targetAlt }, null, false),
              makeStep(cp, 5, "ACT_TKL_LAND_PREC", { facilityId: p.facilityId, targetPos: p.targetPos }, null, false),
            ];
          }
          return [deepClone(cp)];
        };

        return { normalizeShortcutCoords, extractExtras, mergeExtras, cleanActionSwitchParams, expandMacroCheckpoint };
      })();
      const Validator = (() => {
        const KNOWN_PRECOND_MAP = (() => {
          const map = new Map();
          for (const cat of Object.values(SchemaConstants.PRECONDITION_CATEGORIES)) {
            for (const f of cat.fields) map.set(f.key, f.kind);
          }
          return map;
        })();

        const isValidZone3Value = (channelOffset, targetChannel) => {
          if (Number.isInteger(channelOffset)) {
            return channelOffset >= 20 && channelOffset <= 29;
          }
          if (Number.isInteger(targetChannel) && targetChannel >= 10000 && targetChannel <= 49999) {
            const mod = (targetChannel - 10000) % 40;
            return mod >= 20 && mod <= 29;
          }
          return false;
        };

        const hasDurationCondition = (node) => {
          if (!node || typeof node !== "object") return false;
          if (node.type === "DURATION_SEC") return true;
          if (Array.isArray(node.conditions)) return node.conditions.some(hasDurationCondition);
          if (Array.isArray(node.all)) return node.all.some(hasDurationCondition);
          if (Array.isArray(node.any)) return node.any.some(hasDurationCondition);
          if (node.not) return hasDurationCondition(node.not);
          return false;
        };

        const pushIssue = (list, level, code, message, seq, fieldPath) => {
          list.push({ level, code, message, seq: seq == null ? null : seq, fieldPath: fieldPath || "" });
        };

        const validatePreconditions = (pre, seq, basePath, errors, targetAf) => {
          if (pre === undefined) return;
          if (!pre || typeof pre !== "object" || Array.isArray(pre)) {
            pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", "preconditions must be an object.", seq, basePath);
            return;
          }
          for (const [key, val] of Object.entries(pre)) {
            const kind = KNOWN_PRECOND_MAP.get(key);
            if (!kind) {
              pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", `Unknown precondition key '${key}'.`, seq, `${basePath}.${key}`);
              continue;
            }
            if (kind === "boolean" && typeof val !== "boolean") {
              pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", `Precondition '${key}' must be boolean.`, seq, `${basePath}.${key}`);
            } else if (kind === "number" && !isFiniteNum(val)) {
              pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", `Precondition '${key}' must be finite number.`, seq, `${basePath}.${key}`);
            } else if (kind === "list" && !Array.isArray(val)) {
              pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", `Precondition '${key}' must be array.`, seq, `${basePath}.${key}`);
            }
          }
          if (isFiniteNum(pre.minAlt) && isFiniteNum(pre.maxAlt) && pre.minAlt > pre.maxAlt) {
            pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", `minAlt (${pre.minAlt}) exceeds maxAlt (${pre.maxAlt}).`, seq, `${basePath}.minAlt`);
          }
          if (isFiniteNum(pre.maxHdop) && pre.maxHdop < 0) {
            pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", "maxHdop must be >= 0.", seq, `${basePath}.maxHdop`);
          }
          if (isFiniteNum(pre.minFuel) && (pre.minFuel < 0 || pre.minFuel > 1)) {
            pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", "minFuel must be within 0..1.", seq, `${basePath}.minFuel`);
          }
          if (isFiniteNum(pre.maxSpeed) && pre.maxSpeed < 0) {
            pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", "maxSpeed must be >= 0.", seq, `${basePath}.maxSpeed`);
          }
          const allowed = Array.isArray(pre.allowedAirframes) ? pre.allowedAirframes : null;
          const disallowed = Array.isArray(pre.disallowedAirframes) ? pre.disallowedAirframes : null;
          if (allowed && disallowed && allowed.some((a) => disallowed.includes(a))) {
            pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", "allowedAirframes overlaps disallowedAirframes.", seq, `${basePath}.allowedAirframes`);
          }
          if (targetAf) {
            if (allowed && allowed.length > 0 && !allowed.includes(targetAf)) {
              pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", `Target airframe '${targetAf}' excluded by allowedAirframes.`, seq, `${basePath}.allowedAirframes`);
            }
            if (disallowed && disallowed.includes(targetAf)) {
              pushIssue(errors, "ERROR", "PRECONDITION_STATIC_INVALID", `Target airframe '${targetAf}' forbidden by disallowedAirframes.`, seq, `${basePath}.disallowedAirframes`);
            }
          }
        };

        const validateConditionNode = (node, seq, path, errors, warnings) => {
          if (node === undefined || node === null) return;
          if (typeof node !== "object" || Array.isArray(node)) {
            pushIssue(errors, "ERROR", "INVALID_CONDITION_PARAM", "Condition node must be an object.", seq, path);
            return;
          }
          if ("logic" in node || "conditions" in node) {
            const logic = String(node.logic || "").toUpperCase();
            if (logic !== "ALL" && logic !== "ANY" && logic !== "NOT") {
              pushIssue(errors, "ERROR", "INVALID_CONDITION_PARAM", `Condition group logic '${node.logic || ""}' must be ALL, ANY, or NOT.`, seq, `${path}.logic`);
              return;
            }
            const children = node.conditions;
            if (!Array.isArray(children) || children.length === 0) {
              pushIssue(errors, "ERROR", "EMPTY_CONDITION_GROUP", `Condition group '${logic}' must contain non-empty conditions array.`, seq, `${path}.conditions`);
              return;
            }
            for (let k = 0; k < children.length; k++) {
              validateConditionNode(children[k], seq, `${path}.conditions[${k}]`, errors, warnings);
            }
            return;
          }
          if ("all" in node || "any" in node) {
            const key = "all" in node ? "all" : "any";
            const children = node[key];
            if (!Array.isArray(children) || children.length === 0) {
              pushIssue(errors, "ERROR", "EMPTY_CONDITION_GROUP", `Condition group '${key}' must be a non-empty array.`, seq, `${path}.${key}`);
              return;
            }
            for (let k = 0; k < children.length; k++) {
              validateConditionNode(children[k], seq, `${path}.${key}[${k}]`, errors, warnings);
            }
            return;
          }
          if ("not" in node) {
            if (!node.not || typeof node.not !== "object") {
              pushIssue(errors, "ERROR", "EMPTY_CONDITION_GROUP", "Condition 'not' requires a child condition object.", seq, `${path}.not`);
              return;
            }
            validateConditionNode(node.not, seq, `${path}.not`, errors, warnings);
            return;
          }
          const t = node.type;
          if (!SchemaConstants.CONDITION_TYPES.includes(t)) {
            pushIssue(errors, "ERROR", "INVALID_CONDITION_TYPE", `Unknown condition type '${t || ""}'.`, seq, `${path}.type`);
            return;
          }
          if (SchemaConstants.DEFERRED_CONDITIONS.includes(t)) {
            pushIssue(warnings, "WARNING", "DEFERRED_CONDITION_UNSUPPORTED", `Deferred condition '${t}' requires later phase firmware.`, seq, `${path}.type`);
          }
          if (t === "TIMEOUT_SEC") {
            if (!isFiniteNum(node.timeout) || node.timeout <= 0) {
              pushIssue(errors, "ERROR", "INVALID_TIMEOUT_FIELD", "TIMEOUT_SEC requires positive numeric 'timeout' (not 'timeoutSec').", seq, `${path}.timeout`);
            }
          } else if (t === "DURATION_SEC") {
            if (!isFiniteNum(node.durationSec) || node.durationSec < 0) {
              pushIssue(errors, "ERROR", "INVALID_CONDITION_PARAM", "DURATION_SEC requires non-negative 'durationSec'.", seq, `${path}.durationSec`);
            }
          } else if (t === "FUEL_LEVEL_BELOW") {
            if (!isFiniteNum(node.threshold) || node.threshold < 0 || node.threshold > 1) {
              pushIssue(errors, "ERROR", "INVALID_CONDITION_PARAM", "FUEL_LEVEL_BELOW requires 'threshold' in 0..1.", seq, `${path}.threshold`);
            }
          } else if (t === "CROSS_TRACK_ERROR") {
            if (!isFiniteNum(node.maxDevM) || node.maxDevM <= 0) {
              pushIssue(errors, "ERROR", "INVALID_CONDITION_PARAM", "CROSS_TRACK_ERROR requires positive 'maxDevM'.", seq, `${path}.maxDevM`);
            }
          } else if (t === "PAYLOAD_RESP_MATCH") {
            if (typeof node.expectedStatus !== "string" || !node.expectedStatus.trim()) {
              pushIssue(errors, "ERROR", "INVALID_CONDITION_PARAM", "PAYLOAD_RESP_MATCH requires non-empty 'expectedStatus'.", seq, `${path}.expectedStatus`);
            }
          } else if (t === "REDSTONE_INPUT_HIGH") {
            if (!SchemaConstants.REDSTONE_SIDES.includes(node.side)) {
              pushIssue(errors, "ERROR", "INVALID_CONDITION_PARAM", "REDSTONE_INPUT_HIGH requires valid Redstone 'side'.", seq, `${path}.side`);
            }
          }
        };

        const validateHooksPhase = (list, phase, seq, basePath, errors) => {
          if (list === undefined) return;
          if (!Array.isArray(list)) {
            pushIssue(errors, "ERROR", "INVALID_HOOK_PARAM", `${phase} must be an array.`, seq, basePath);
            return;
          }
          for (let h = 0; h < list.length; h++) {
            const hook = list[h];
            const hp = `${basePath}[${h}]`;
            if (!hook || typeof hook !== "object" || !SchemaConstants.HOOK_TYPES.includes(hook.type)) {
              pushIssue(errors, "ERROR", "INVALID_HOOK_PARAM", `Invalid hook type in ${phase}[${h}].`, seq, `${hp}.type`);
              continue;
            }
            if (hook.type === "REDSTONE_SET") {
              if (!SchemaConstants.REDSTONE_SIDES.includes(hook.side)) {
                pushIssue(errors, "ERROR", "INVALID_HOOK_PARAM", "REDSTONE_SET requires valid 'side'.", seq, `${hp}.side`);
              }
            } else if (hook.type === "REDSTONE_PULSE") {
              if (!SchemaConstants.REDSTONE_SIDES.includes(hook.side)) {
                pushIssue(errors, "ERROR", "INVALID_HOOK_PARAM", "REDSTONE_PULSE requires valid 'side'.", seq, `${hp}.side`);
              }
              if (!isFiniteNum(hook.durationMs) || hook.durationMs <= 0) {
                pushIssue(errors, "ERROR", "INVALID_HOOK_PARAM", "REDSTONE_PULSE requires positive 'durationMs'.", seq, `${hp}.durationMs`);
              }
            } else if (hook.type === "ZONE3_PAYLOAD_CMD") {
              if (!isValidZone3Value(hook.channelOffset, hook.targetChannel)) {
                pushIssue(errors, "ERROR", "INVALID_ZONE3_CHANNEL", "ZONE3_PAYLOAD_CMD requires channelOffset (20..29) or Zone 3 targetChannel.", seq, `${hp}.channelOffset`);
              }
              if (typeof hook.command !== "string" || !hook.command.trim()) {
                pushIssue(errors, "ERROR", "INVALID_HOOK_PARAM", "ZONE3_PAYLOAD_CMD requires non-empty 'command'.", seq, `${hp}.command`);
              }
            } else if (hook.type === "NOTIFY_OPERATOR") {
              if (typeof hook.message !== "string" || !hook.message.trim()) {
                pushIssue(errors, "ERROR", "INVALID_HOOK_PARAM", "NOTIFY_OPERATOR requires non-empty 'message'.", seq, `${hp}.message`);
              }
            }
          }
        };

        const validateMission = (mission, opts) => {
          const errors = [];
          const warnings = [];
          const targetAirframe = opts && opts.targetAirframe ? opts.targetAirframe : null;
          if (!mission || typeof mission !== "object" || Array.isArray(mission)) {
            pushIssue(errors, "ERROR", "INVALID_MISSION_OBJECT", "Mission payload must be a JSON object.", null, "");
            return { valid: false, errors, warnings };
          }
          if (Array.isArray(mission.items)) {
            pushIssue(errors, "ERROR", "LEGACY_MISSION_FORMAT", "Legacy v1.x 'items[]' format is unsupported in AMM v2.0.0.", null, "items");
          }
          if (typeof mission.missionId !== "string" || !mission.missionId.trim()) {
            pushIssue(errors, "ERROR", "MISSING_MISSION_ID", "missionId is required.", null, "missionId");
          }
          if (mission.executionMode && !SchemaConstants.EXECUTION_MODES.includes(mission.executionMode)) {
            pushIssue(errors, "ERROR", "INVALID_EXECUTION_MODE", `Invalid executionMode '${mission.executionMode}'.`, null, "executionMode");
          }
          if (mission.fallbackPolicy && !SchemaConstants.FALLBACK_POLICIES.includes(mission.fallbackPolicy)) {
            pushIssue(errors, "ERROR", "INVALID_FALLBACK_POLICY", `Invalid fallbackPolicy '${mission.fallbackPolicy}'.`, null, "fallbackPolicy");
          }
          if (!Array.isArray(mission.checkpoints)) {
            pushIssue(errors, "ERROR", "INVALID_CHECKPOINTS_ARRAY", "checkpoints must be an array.", null, "checkpoints");
            return { valid: errors.length === 0, errors, warnings };
          }
          if (mission.checkpoints.length === 0) {
            pushIssue(warnings, "WARNING", "EMPTY_DRAFT", "Mission has 0 checkpoints.", null, "checkpoints");
          }
          const seenIds = new Set();
          for (let i = 0; i < mission.checkpoints.length; i++) {
            const cp = mission.checkpoints[i];
            const seq = i + 1;
            const cpPath = `checkpoints[${i}]`;
            if (!cp || typeof cp !== "object" || Array.isArray(cp)) {
              pushIssue(errors, "ERROR", "INVALID_CHECKPOINT_OBJECT", `Checkpoint #${seq} must be an object.`, seq, cpPath);
              continue;
            }
            const cpId = typeof cp.checkpointId === "string" ? cp.checkpointId.trim() : "";
            if (!cpId) {
              pushIssue(errors, "ERROR", "MISSING_CHECKPOINT_ID", `CP#${seq} requires a non-empty checkpointId.`, seq, `${cpPath}.checkpointId`);
            } else if (seenIds.has(cpId)) {
              pushIssue(errors, "ERROR", "DUPLICATE_CHECKPOINT_ID", `Duplicate checkpointId '${cpId}'.`, seq, `${cpPath}.checkpointId`);
            } else {
              seenIds.add(cpId);
            }
            const act = cp.action;
            if (SchemaConstants.isLegacyAction(act)) {
              pushIssue(errors, "ERROR", "LEGACY_ACTION_UNSUPPORTED", `Legacy action '${act}' is forbidden in v2.0.0.`, seq, `${cpPath}.action`);
            } else if (SchemaConstants.isActionDeferred(act)) {
              pushIssue(warnings, "WARNING", "DEFERRED_ACTION_UNSUPPORTED", `Deferred action '${act}' is not runnable in current firmware.`, seq, `${cpPath}.action`);
            } else if (SchemaConstants.isMacroDeferred(act)) {
              pushIssue(warnings, "WARNING", "DEFERRED_MACRO_UNSUPPORTED", `Deferred macro '${act}' is not runnable in current firmware.`, seq, `${cpPath}.action`);
            } else if (!SchemaConstants.isActionActive(act) && !SchemaConstants.isMacroActive(act)) {
              pushIssue(errors, "ERROR", "UNKNOWN_ACTION", `Unknown action '${act || ""}'.`, seq, `${cpPath}.action`);
            }
            const p = cp.params && typeof cp.params === "object" ? cp.params : {};
            const meta = SchemaConstants.ACTIVE_ACTIONS[act] || SchemaConstants.MACRO_META[act];
            if (act === "ACT_NAV_CORRIDOR") {
              const sOk = isPosXZ(p.startPos);
              const eOk = isPosXZ(p.endPos);
              if (!sOk || !eOk || (p.startPos.x === p.endPos.x && p.startPos.z === p.endPos.z)) {
                pushIssue(errors, "ERROR", "INVALID_CORRIDOR_BOUNDS", "ACT_NAV_CORRIDOR requires distinct valid startPos and endPos.", seq, !sOk ? `${cpPath}.params.startPos` : `${cpPath}.params.endPos`);
              }
            } else if (meta && meta.spatial && !meta.optionalPos && !isPosXZ(p.targetPos)) {
              pushIssue(errors, "ERROR", "MISSING_TARGET_POS", `${act} requires valid targetPos {x, z}.`, seq, `${cpPath}.params.targetPos`);
            }
            if (meta && meta.hasPoi && !isPosXZ(p.poiPos)) {
              pushIssue(errors, "ERROR", "MISSING_POI_POS", `${act} requires valid poiPos {x, z}.`, seq, `${cpPath}.params.poiPos`);
            }
            if (p.radius !== undefined) {
              if (!isFiniteNum(p.radius) || p.radius <= 0) {
                pushIssue(errors, "ERROR", "INVALID_PARAM_RANGE", "Orbit radius must be > 0.", seq, `${cpPath}.params.radius`);
              } else if (p.radius < 20) {
                pushIssue(warnings, "WARNING", "ORBIT_RADIUS_BELOW_FCP_MIN", `Orbit radius ${p.radius}m is below FCP 20m minimum.`, seq, `${cpPath}.params.radius`);
              }
            }
            if (act === "ACT_PAT_HOLD_POS" || act === "ACT_PAT_POI_HOLD" || act === "ACT_PAT_LOITER_TIME") {
              if (p.durationSec === undefined || p.durationSec === null || p.durationSec === "") {
                if (!hasDurationCondition(cp.completeWhen)) {
                  pushIssue(warnings, "WARNING", "MISSING_DURATION_HOLD_MANUAL", `${act} without durationSec holds until manual command.`, seq, `${cpPath}.params.durationSec`);
                }
              } else if (!isFiniteNum(p.durationSec) || p.durationSec <= 0) {
                pushIssue(errors, "ERROR", "INVALID_PARAM_RANGE", "durationSec must be > 0.", seq, `${cpPath}.params.durationSec`);
              }
            }
            if (act === "ACT_PAY_BUS_CMD") {
              if (!isValidZone3Value(p.channelOffset, p.targetChannel)) {
                pushIssue(errors, "ERROR", "INVALID_ZONE3_CHANNEL", "ACT_PAY_BUS_CMD requires Zone 3 channelOffset (20..29) or targetChannel.", seq, `${cpPath}.params.channelOffset`);
              }
              if (typeof p.command !== "string" || !p.command.trim()) {
                pushIssue(errors, "ERROR", "INVALID_PARAM_RANGE", "ACT_PAY_BUS_CMD requires non-empty command.", seq, `${cpPath}.params.command`);
              }
            }
            if (act === "ACT_PAY_REDSTONE" && p.side !== undefined && !SchemaConstants.REDSTONE_SIDES.includes(p.side)) {
              pushIssue(errors, "ERROR", "INVALID_PARAM_RANGE", "ACT_PAY_REDSTONE requires valid Redstone side.", seq, `${cpPath}.params.side`);
            }
            if (isFiniteNum(p.targetAlt) && p.targetAlt < 0) {
              pushIssue(warnings, "WARNING", "INVALID_PARAM_RANGE", `targetAlt (${p.targetAlt}m) is negative.`, seq, `${cpPath}.params.targetAlt`);
            }
            validatePreconditions(cp.preconditions, seq, `${cpPath}.preconditions`, errors, targetAirframe);
            if (Array.isArray(cp.decorators)) {
              for (let d = 0; d < cp.decorators.length; d++) {
                const dec = cp.decorators[d];
                const dId = dec && dec.decoratorId;
                const dp = `${cpPath}.decorators[${d}]`;
                if (SchemaConstants.isDecoratorDeferred(dId)) {
                  pushIssue(warnings, "WARNING", "DEFERRED_DECORATOR_UNSUPPORTED", `Deferred decorator '${dId}' is not active in current firmware.`, seq, `${dp}.decoratorId`);
                } else if (!SchemaConstants.isDecoratorActive(dId)) {
                  pushIssue(errors, "ERROR", "UNKNOWN_DECORATOR", `Unknown decorator '${dId || ""}'.`, seq, `${dp}.decoratorId`);
                } else {
                  const ov = (dec && dec.overrideParams) || {};
                  if (dId === "DEC_RETRY_N" && ov.maxAttempts !== undefined && (!Number.isInteger(ov.maxAttempts) || ov.maxAttempts < 1)) {

              spatialPoints.push({ idx: i, pos: cp.params.startPos });
              spatialPoints.push({ idx: i, pos: cp.params.endPos });
            } else {
              const p = getCheckpointPrimaryPos(cp);
              if (p) spatialPoints.push({ idx: i, pos: p });
            }
          }
          if (spatialPoints.length >= 2) {
            ctx.strokeStyle = COLORS.pathActive;
            ctx.lineWidth = 2;
            ctx.beginPath();
            const firstS = worldToScreen(spatialPoints[0].pos.x, spatialPoints[0].pos.z, view);
            ctx.moveTo(firstS.sx, firstS.sy);
            for (let k = 1; k < spatialPoints.length; k++) {
              const sk = worldToScreen(spatialPoints[k].pos.x, spatialPoints[k].pos.z, view);
              ctx.lineTo(sk.sx, sk.sy);
            }
            ctx.stroke();
          }
          if (st.mission.executionMode === "REPEAT" && spatialPoints.length >= 2) {
            const loopIdx = computeRepeatLoopTarget(cps);
            const loopPt = spatialPoints.find((sp) => sp.idx >= loopIdx);
            const lastPt = spatialPoints[spatialPoints.length - 1];
            if (loopPt && lastPt && loopPt !== lastPt) {
              const sa = worldToScreen(lastPt.pos.x, lastPt.pos.z, view);
              const sb = worldToScreen(loopPt.pos.x, loopPt.pos.z, view);
              ctx.setLineDash([6, 5]);
              ctx.strokeStyle = COLORS.pathRepeat;
              ctx.lineWidth = 2;
              ctx.beginPath(); ctx.moveTo(sa.sx, sa.sy); ctx.lineTo(sb.sx, sb.sy); ctx.stroke();
              ctx.setLineDash([]);
            }
          }

          // Layer 4: Loiter Rings & POI Sightlines
          for (let i = 0; i < cps.length; i++) {
            const cp = cps[i];
            const p = cp.params || {};
            const primary = getCheckpointPrimaryPos(cp);
            if (primary && isFiniteNum(p.radius) && (cp.action.startsWith("ACT_PAT_LOITER_") || cp.action === "MAC_RECON_ORBIT")) {
              const sc = worldToScreen(primary.x, primary.z, view);
              ctx.setLineDash([4, 4]);
              ctx.strokeStyle = COLORS.loiterRing;
              ctx.lineWidth = 1.5;
              ctx.beginPath(); ctx.arc(sc.sx, sc.sy, Math.max(8, p.radius * view.zoom), 0, Math.PI * 2); ctx.stroke();
              ctx.setLineDash([]);
            }
            if (primary && isPosXZ(p.poiPos)) {
              const s1 = worldToScreen(primary.x, primary.z, view);
              const s2 = worldToScreen(p.poiPos.x, p.poiPos.z, view);
              ctx.setLineDash([3, 3]);
              ctx.strokeStyle = COLORS.poiSight;
              ctx.lineWidth = 1.2;
              ctx.beginPath(); ctx.moveTo(s1.sx, s1.sy); ctx.lineTo(s2.sx, s2.sy); ctx.stroke();
              ctx.setLineDash([]);
            }
          }

          // Layer 5 & 6: Checkpoints + Secondary Handles
          const labelCandidates = [];
          for (let i = 0; i < cps.length; i++) {
            const cp = cps[i];
            const isSel = i === st.ui.selectedIndex;
            const sev = issueBySeq.get(i + 1);
            const nodeColor = sev === "ERROR" ? COLORS.cpError : (sev === "WARNING" ? COLORS.cpWarn : (SchemaConstants.isMacroActive(cp.action) ? COLORS.cpMacro : COLORS.cpActive));
            const primary = getCheckpointPrimaryPos(cp);
            if (primary) {
              const sc = worldToScreen(primary.x, primary.z, view);
              if (isSel) {
                ctx.strokeStyle = COLORS.cpSelected;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(sc.sx, sc.sy, 11, 0, Math.PI * 2); ctx.stroke();
              }
              ctx.fillStyle = nodeColor;
              ctx.beginPath(); ctx.arc(sc.sx, sc.sy, 6.5, 0, Math.PI * 2); ctx.fill();
              labelCandidates.push({ sx: sc.sx, sy: sc.sy, label: `#${i + 1} ${cp.checkpointId}` });
            }
            if (cp.action === "ACT_NAV_CORRIDOR" && isPosXZ(cp.params.endPos)) {
              const sEnd = worldToScreen(cp.params.endPos.x, cp.params.endPos.z, view);
              ctx.fillStyle = isSel ? COLORS.cpSelected : COLORS.corridorStroke;
              ctx.fillRect(sEnd.sx - 5, sEnd.sy - 5, 10, 10);
            }
            if (isPosXZ(cp.params.poiPos)) {
              const sPoi = worldToScreen(cp.params.poiPos.x, cp.params.poiPos.z, view);
              ctx.fillStyle = COLORS.poiNode;
              ctx.beginPath(); ctx.arc(sPoi.sx, sPoi.sy, 5, 0, Math.PI * 2); ctx.fill();
            }
          }

          // Layer 7: Stacked Labels
          const offsets = computeLabelStackOffsets(labelCandidates, 18, 15);
          ctx.font = "11px monospace";
          for (let i = 0; i < labelCandidates.length; i++) {
            const c = labelCandidates[i];
            const ly = c.sy - 12 - offsets[i];
            ctx.fillStyle = COLORS.text;
            ctx.fillText(c.label, c.sx + 10, ly);
          }

          // Layer 8: Cursor HUD
          if (cursorWorld) {
            ctx.fillStyle = COLORS.muted;
            ctx.font = "11px monospace";
            ctx.fillText(`X:${Math.round(cursorWorld.x)} Z:${Math.round(cursorWorld.z)} (${Math.round(view.zoom * 100)}%)`, 12, height - 12);
          }
          ctx.restore();
        };

        const renderAltProfile = () => {
          if (!altCanvasEl) return;
          const ctx = altCanvasEl.getContext && altCanvasEl.getContext("2d");
          if (!ctx) return;
          const { width, height, dpr } = syncCanvasDpr(altCanvasEl);
          const st = Store.getState();
          const cps = st.mission.checkpoints || [];
          ctx.save();
          if (typeof ctx.setTransform === "function") ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.fillStyle = "#0f1522";
          ctx.fillRect(0, 0, width, height);
          const bounds = getAltBounds(cps, st.mission.defaults);
          if (cps.length === 0) {
            ctx.fillStyle = COLORS.muted;
            ctx.font = "11px sans-serif";
            ctx.fillText("No checkpoints for altitude profile", 16, height / 2);
            ctx.restore();
            return;
          }
          ctx.strokeStyle = COLORS.pathActive;
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let i = 0; i < cps.length; i++) {
            const pt = getAltPointScreen(i, width, height, bounds);
            if (i === 0) ctx.moveTo(pt.sx, pt.sy);
            else ctx.lineTo(pt.sx, pt.sy);
          }
          ctx.stroke();
          for (let i = 0; i < cps.length; i++) {
            const pt = getAltPointScreen(i, width, height, bounds);
            ctx.fillStyle = i === st.ui.selectedIndex ? COLORS.cpSelected : COLORS.cpActive;
            ctx.beginPath(); ctx.arc(pt.sx, pt.sy, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = COLORS.text;
            ctx.font = "10px monospace";
            ctx.fillText(`#${i + 1} ${Math.round(pt.effAlt)}m`, pt.sx - 18, Math.max(12, pt.sy - 8));
          }
          ctx.restore();
        };

        const centerOnCheckpoint = (index) => {
          const st = Store.getState();
          const cp = st.mission.checkpoints[index];
          const primary = getCheckpointPrimaryPos(cp);
          if (!primary) return;
          Store.setUi({ viewOffset: { x: primary.x, z: primary.z } });
        };

        const fitView = () => {
          const st = Store.getState();
          const pts = [];
          for (const cp of st.mission.checkpoints || []) {
            const p = getCheckpointPrimaryPos(cp);
            if (p) pts.push(p);
            if (cp && cp.params && isPosXZ(cp.params.endPos)) pts.push(cp.params.endPos);
          }
          if (pts.length === 0) {
            Store.setUi({ viewOffset: { x: 0, z: 0 }, zoom: 1.0 });
            return;
          }
          let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
          for (const p of pts) {
            if (p.x < minX) minX = p.x;
            if (p.x > maxX) maxX = p.x;
            if (p.z < minZ) minZ = p.z;
            if (p.z > maxZ) maxZ = p.z;
          }
          const spanX = Math.max(100, maxX - minX);
          const spanZ = Math.max(100, maxZ - minZ);
          const w = (mapCanvasEl && (mapCanvasEl.clientWidth || mapCanvasEl.width)) || 800;
          const h = (mapCanvasEl && (mapCanvasEl.clientHeight || mapCanvasEl.height)) || 600;
          const zoom = Math.max(0.15, Math.min(3.0, Math.min((w * 0.72) / spanX, (h * 0.72) / spanZ)));
          Store.setUi({ viewOffset: { x: (minX + maxX) / 2, z: (minZ + maxZ) / 2 }, zoom });
        };

        const bindMapEvents = (el) => {
          if (!el || boundTarget.has(el)) return;
          boundTarget.add(el);
          const localPt = (e) => {
            const rect = el.getBoundingClientRect ? el.getBoundingClientRect() : { left: 0, top: 0, width: 800, height: 600 };
            return {
              sx: (e.clientX || 0) - rect.left,
              sy: (e.clientY || 0) - rect.top,
              width: rect.width || el.clientWidth || el.width || 800,
              height: rect.height || el.clientHeight || el.height || 600,
            };
          };
          el.addEventListener("mousedown", (e) => {
            const st = Store.getState();
            const pt = localPt(e);
            const view = { offsetX: st.ui.viewOffset.x, offsetZ: st.ui.viewOffset.z, zoom: st.ui.zoom, width: pt.width, height: pt.height };
            if (e.button === 0) {
              const hit = hitTestCanvas(st.mission.checkpoints, pt.sx, pt.sy, view, st.ui.selectedIndex);
              if (hit) {
                Store.selectCheckpoint(hit.index);
                Store.beginUndoTransaction();
                dragState = { target: "MAP", kind: hit.kind, index: hit.index };
                return;
              }
            }
            if (e.button === 0 || e.button === 1 || e.button === 2) {
              dragState = { target: "PAN", startSx: pt.sx, startSy: pt.sy, origOffset: deepClone(st.ui.viewOffset) };
            }
          });
          el.addEventListener("mousemove", (e) => {
            const st = Store.getState();
            const pt = localPt(e);
            const view = { offsetX: st.ui.viewOffset.x, offsetZ: st.ui.viewOffset.z, zoom: st.ui.zoom, width: pt.width, height: pt.height };
            cursorWorld = screenToWorld(pt.sx, pt.sy, view);
            if (!dragState) { render(); return; }
            if (dragState.target === "PAN") {
              const dx = (pt.sx - dragState.startSx) / (st.ui.zoom || 1);
              const dz = (pt.sy - dragState.startSy) / (st.ui.zoom || 1);
              Store.setUi({ viewOffset: { x: dragState.origOffset.x - dx, z: dragState.origOffset.z - dz } });
              return;
            }
            if (dragState.target === "MAP") {
              const snapOn = e.altKey ? false : st.ui.gridSnap;
              const wx = snapCoord(cursorWorld.x, st.ui.gridStep, snapOn);
              const wz = snapCoord(cursorWorld.z, st.ui.gridStep, snapOn);
              const dIdx = dragState.index;
              const dKind = dragState.kind;
              Store.mutateMission((m) => {
                const cp = m.checkpoints[dIdx];
                if (!cp || !cp.params) return;
                if (dKind === "CORRIDOR_END") cp.params.endPos = { x: wx, z: wz };
                else if (dKind === "POI") cp.params.poiPos = { x: wx, z: wz };
                else if (cp.action === "ACT_NAV_CORRIDOR") cp.params.startPos = { x: wx, z: wz };
                else cp.params.targetPos = { x: wx, z: wz };
              }, { pushUndo: false });
            }
          });
          const endDrag = () => {
            if (dragState && dragState.target === "MAP") {
              Store.commitUndoTransaction();
            }
            dragState = null;
          };
          el.addEventListener("mouseup", endDrag);
          el.addEventListener("wheel", (e) => {
            if (e.preventDefault) e.preventDefault();
            const st = Store.getState();
            const factor = (e.deltaY || 0) > 0 ? 0.9 : 1.1;
            const nextZoom = Math.max(0.1, Math.min(4.0, st.ui.zoom * factor));
            Store.setUi({ zoom: nextZoom });
          });
        };

        const bindAltEvents = (el) => {
          if (!el || boundTarget.has(el)) return;
          boundTarget.add(el);
          const localPt = (e) => {
            const rect = el.getBoundingClientRect ? el.getBoundingClientRect() : { left: 0, top: 0, width: 800, height: 120 };
            return {
              sx: (e.clientX || 0) - rect.left,
              sy: (e.clientY || 0) - rect.top,
              width: rect.width || el.clientWidth || el.width || 800,
              height: rect.height || el.clientHeight || el.height || 120,
            };
          };
          el.addEventListener("mousedown", (e) => {
            const st = Store.getState();
            const cps = st.mission.checkpoints || [];
            if (cps.length === 0) return;
            const pt = localPt(e);
            const bounds = getAltBounds(cps, st.mission.defaults);
            let bestIdx = -1;
            let bestDist = 18;
            for (let i = 0; i < cps.length; i++) {
              const s = getAltPointScreen(i, pt.width, pt.height, bounds);
              const dist = Math.hypot(pt.sx - s.sx, pt.sy - s.sy);
              if (dist <= bestDist) { bestDist = dist; bestIdx = i; }
            }
            if (bestIdx >= 0) {
              Store.selectCheckpoint(bestIdx);
              Store.beginUndoTransaction();
              dragState = { target: "ALT", index: bestIdx, bounds, height: pt.height };
            }
          });
          el.addEventListener("mousemove", (e) => {
            if (!dragState || dragState.target !== "ALT") return;
            const pt = localPt(e);
            const padY = 18;
            const usable = Math.max(1, dragState.height - padY * 2);
            const frac = ((dragState.height - padY) - pt.sy) / usable;
            const rawAlt = dragState.bounds.altMin + frac * (dragState.bounds.altMax - dragState.bounds.altMin);
            const nextAlt = snapAlt(rawAlt, Boolean(e.altKey));
            const idx = dragState.index;
            Store.mutateMission((m) => {
              const cp = m.checkpoints[idx];
              if (cp) {
                cp.params = cp.params || {};
                cp.params.targetAlt = nextAlt;
              }
            }, { pushUndo: false });
          });
          el.addEventListener("mouseup", () => {
            if (dragState && dragState.target === "ALT") {
              Store.commitUndoTransaction();
            }
            dragState = null;
          });
        };

        const attach = (mapEl, altEl) => {
          mapCanvasEl = mapEl || mapCanvasEl;
          altCanvasEl = altEl || altCanvasEl;
          bindMapEvents(mapCanvasEl);
          bindAltEvents(altCanvasEl);
          render();
          renderAltProfile();
        };

        return {
          worldToScreen,
          screenToWorld,
          snapCoord,
          snapAlt,
          computeRepeatLoopTarget,
          computeLabelStackOffsets,
          hitTestCanvas,
          getAltPointScreen,
          centerOnCheckpoint,
          fitView,
          attach,
          render,
          renderAltProfile,
        };
      })();
      const InspectorUI = (() => {
        const el = (tag, cls, text) => {
          const node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text !== undefined && text !== null) node.textContent = String(text);
          return node;
        };

        const clearNode = (node) => {
          if (!node) return;
          node.textContent = "";
          if (Array.isArray(node.children)) node.children.length = 0;
        };

        const showToast = (message, level) => {
          const banner = document.getElementById("toastBanner");
          if (!banner) return;
          banner.textContent = String(message || "");
          banner.className = level === "error" ? "toast-banner error" : (level === "warn" ? "toast-banner warn" : "toast-banner");
          banner.hidden = !message;
        };

        const makeField = (labelText, inputEl, full) => {
          const wrap = el("label", full ? "field-group full" : "field-group");
          if (inputEl && typeof inputEl.setAttribute === "function" && (!inputEl.getAttribute || !inputEl.getAttribute("aria-label"))) {
            inputEl.setAttribute("aria-label", labelText);
          }
          wrap.appendChild(el("span", "field-label", labelText));
          wrap.appendChild(inputEl);
          return wrap;
        };

        const makeInput = (type, value, fieldPath, onCommit) => {
          const inp = el("input");
          inp.type = type || "text";
          inp.value = value === undefined || value === null ? "" : String(value);
          if (fieldPath) inp.setAttribute("data-field-path", fieldPath);
          inp.addEventListener("change", () => onCommit(inp.value, inp));
          return inp;
        };

        const makeSelect = (options, value, fieldPath, onCommit) => {
          const sel = el("select");
          if (fieldPath) sel.setAttribute("data-field-path", fieldPath);
          for (const optDef of options) {
            const o = el("option", "", typeof optDef === "string" ? optDef : optDef.label);
            o.value = typeof optDef === "string" ? optDef : optDef.value;
            if (o.value === value) o.selected = true;
            sel.appendChild(o);
          }
          sel.value = value == null ? "" : String(value);
          sel.addEventListener("change", () => onCommit(sel.value));
          return sel;
        };

        const renderTopBar = (st) => {
          const m = st.mission;
          const mId = document.getElementById("missionIdInput");
          if (mId && mId.value !== m.missionId) mId.value = m.missionId || "";
          const btnS = document.getElementById("execModeSingle");
          const btnR = document.getElementById("execModeRepeat");
          if (btnS) btnS.setAttribute("aria-pressed", String(m.executionMode !== "REPEAT"));
          if (btnR) btnR.setAttribute("aria-pressed", String(m.executionMode === "REPEAT"));
          const btnUndo = document.getElementById("btnUndo");
          const btnRedo = document.getElementById("btnRedo");
          if (btnUndo) btnUndo.disabled = !Store.canUndo();
          if (btnRedo) btnRedo.disabled = !Store.canRedo();
          const btnRaw = document.getElementById("btnRawJson");
          if (btnRaw) btnRaw.setAttribute("aria-expanded", String(Boolean(st.ui.rawJsonOpen)));
          const drawer = document.getElementById("rawJsonDrawer");
          if (drawer) {
            drawer.hidden = !st.ui.rawJsonOpen;
            if (st.ui.rawJsonOpen) {
              const ta = document.getElementById("rawJsonTextarea");
              if (ta && document.activeElement !== ta) {
                ta.value = JsonIO.serializeMission(m);
              }
            }
          }
          const emptyCta = document.getElementById("emptyCanvasCta");
          if (emptyCta) emptyCta.hidden = (m.checkpoints || []).length > 0;
          const altPane = document.getElementById("altProfilePane");
          if (altPane) altPane.hidden = !st.ui.altProfileOpen;
          const btnAlt = document.getElementById("btnToggleAltProfile");
          if (btnAlt) btnAlt.setAttribute("aria-expanded", String(Boolean(st.ui.altProfileOpen)));
          const zoomEl = document.getElementById("zoomReadout");
          if (zoomEl) zoomEl.textContent = `${Math.round((st.ui.zoom || 1) * 100)}%`;
          const snapBtn = document.getElementById("btnToggleSnap");
          if (snapBtn) snapBtn.setAttribute("aria-pressed", String(Boolean(st.ui.gridSnap)));
        };

        const renderLeftRail = (st) => {
          const cps = st.mission.checkpoints || [];
          const countEl = document.getElementById("cpCountBadge");
          if (countEl) countEl.textContent = String(cps.length);
          const listEl = document.getElementById("cpList");
          if (!listEl) return;
          clearNode(listEl);

          const errSeqs = new Set((st.lastValidation.errors || []).map((e) => e.seq).filter(Boolean));
          const warnSeqs = new Set((st.lastValidation.warnings || []).map((w) => w.seq).filter(Boolean));

          for (let i = 0; i < cps.length; i++) {
            const cp = cps[i];
            const seq = i + 1;
            const row = el("div", i === st.ui.selectedIndex ? "cp-row selected" : "cp-row");
            const top = el("div", "cp-row-top");
            const selBtn = el("button", "cp-select-btn");
            selBtn.type = "button";
            selBtn.appendChild(el("span", "mono tabular badge", `#${seq}`));
            selBtn.appendChild(el("strong", "mono", cp.checkpointId || `CP_${seq}`));
            selBtn.appendChild(el("span", SchemaConstants.isMacroActive(cp.action) ? "badge mac" : "badge", cp.action));
            if (errSeqs.has(seq)) selBtn.appendChild(el("span", "badge err", "ERR"));
            else if (warnSeqs.has(seq)) selBtn.appendChild(el("span", "badge warn", "WARN"));
            selBtn.addEventListener("click", () => Store.selectCheckpoint(i));

            const mini = el("div", "cp-actions-mini");
            const bUp = el("button", "", "▲"); bUp.type = "button"; bUp.disabled = i === 0;
            bUp.setAttribute("aria-label", `Move CP#${seq} up`);
            bUp.addEventListener("click", () => Store.moveCheckpoint(i, i - 1));
            const bDn = el("button", "", "▼"); bDn.type = "button"; bDn.disabled = i === cps.length - 1;
            bDn.setAttribute("aria-label", `Move CP#${seq} down`);
            bDn.addEventListener("click", () => Store.moveCheckpoint(i, i + 1));
            const bDup = el("button", "", "⧉"); bDup.type = "button";
            bDup.setAttribute("aria-label", `Duplicate CP#${seq}`);
            bDup.addEventListener("click", () => Store.duplicateCheckpoint(i));
            const bDel = el("button", "", "✕"); bDel.type = "button";
            bDel.setAttribute("aria-label", `Delete CP#${seq}`);
            bDel.addEventListener("click", () => Store.deleteCheckpoint(i));
            mini.appendChild(bUp); mini.appendChild(bDn); mini.appendChild(bDup); mini.appendChild(bDel);

            top.appendChild(selBtn);
            top.appendChild(mini);
            row.appendChild(top);

            const meta = SchemaConstants.ACTIVE_ACTIONS[cp.action] || SchemaConstants.DEFERRED_ACTIONS[cp.action] || SchemaConstants.MACRO_META[cp.action];
            row.appendChild(el("div", "cp-summary", meta ? meta.summary : cp.action));

            const chips = el("div", "chip-row");
            if (Array.isArray(cp.decorators) && cp.decorators.length) chips.appendChild(el("span", "badge", `DEC:${cp.decorators.length}`));
            if (cp.preconditions && Object.keys(cp.preconditions).length) chips.appendChild(el("span", "badge", `PRE:${Object.keys(cp.preconditions).length}`));
            if (cp.completeWhen || cp.abortWhen) chips.appendChild(el("span", "badge", "COND"));
            const hkCount = (cp.onEnter ? cp.onEnter.length : 0) + (cp.onExit ? cp.onExit.length : 0) + (cp.onAbort ? cp.onAbort.length : 0);
            if (hkCount > 0) chips.appendChild(el("span", "badge", `HOOK:${hkCount}`));
            if (chips.children.length > 0) row.appendChild(chips);

            listEl.appendChild(row);
          }
        };

        const renderParamsTab = (body, cp, idx, st) => {
          const p = cp.params || {};
          const eff = DefaultResolver.resolveCheckpointDefaults(cp, st.mission.defaults);
          const grid = el("div", "form-grid");
          const setParam = (key, val) => Store.mutateMission((m) => {
            m.checkpoints[idx].params = m.checkpoints[idx].params || {};
            if (val === undefined) delete m.checkpoints[idx].params[key];
            else m.checkpoints[idx].params[key] = val;
          });
          const setPosCoord = (posKey, axis, raw) => Store.mutateMission((m) => {
            const cpP = (m.checkpoints[idx].params = m.checkpoints[idx].params || {});
            const num = Number(raw);
            cpP[posKey] = Object.assign({ x: 0, z: 0 }, cpP[posKey] || {});
            if (Number.isFinite(num)) cpP[posKey][axis] = num;
          });

          if (cp.action === "ACT_NAV_CORRIDOR") {
            const sx = (p.startPos && p.startPos.x) ?? 0, sz = (p.startPos && p.startPos.z) ?? 0;
            const ex = (p.endPos && p.endPos.x) ?? 0, ez = (p.endPos && p.endPos.z) ?? 0;
            grid.appendChild(makeField("startPos.x", makeInput("number", sx, `checkpoints[${idx}].params.startPos`, (v) => setPosCoord("startPos", "x", v))));
            grid.appendChild(makeField("startPos.z", makeInput("number", sz, `checkpoints[${idx}].params.startPos.z`, (v) => setPosCoord("startPos", "z", v))));
            grid.appendChild(makeField("endPos.x", makeInput("number", ex, `checkpoints[${idx}].params.endPos`, (v) => setPosCoord("endPos", "x", v))));
            grid.appendChild(makeField("endPos.z", makeInput("number", ez, `checkpoints[${idx}].params.endPos.z`, (v) => setPosCoord("endPos", "z", v))));

            grid.appendChild(makeField("poiPos.x", makeInput("number", px, `checkpoints[${idx}].params.poiPos`, (v) => setPosCoord("poiPos", "x", v))));

          grid.appendChild(makeField(`cruiseSpeed (def ${eff.cruiseSpeed})`, makeInput("number", p.cruiseSpeed ?? "", `checkpoints[${idx}].params.cruiseSpeed`, (v) => setParam("cruiseSpeed", v === "" ? undefined : Number(v)))));
          grid.appendChild(makeField(`acceptanceRadius (def ${eff.acceptanceRadius}m)`, makeInput("number", p.acceptanceRadius ?? "", `checkpoints[${idx}].params.acceptanceRadius`, (v) => setParam("acceptanceRadius", v === "" ? undefined : Number(v)))));
          grid.appendChild(makeField("headingMode", makeSelect(["", ...SchemaConstants.HEADING_MODES], p.headingMode || "", `checkpoints[${idx}].params.headingMode`, (v) => setParam("headingMode", v || undefined))));

            if (cp.action === "ACT_PAT_LOITER_TURNS") {

            grid.appendChild(makeField("durationSec (s)", makeInput("number", p.durationSec ?? "", `checkpoints[${idx}].params.durationSec`, (v) => setParam("durationSec", v === "" ? undefined : Number(v)))));
