            const effCh = DefaultResolver.resolveZone3Channel(p.channelOffset ?? p.targetChannel, baseCh);
            grid.appendChild(makeField(`channelOffset (20..29 -> CH ${effCh ?? "?"})`, makeInput("number", p.channelOffset ?? 20, `checkpoints[${idx}].params.channelOffset`, (v) => setParam("channelOffset", Number(v)))));
            grid.appendChild(makeField("command", makeInput("text", p.command || "", `checkpoints[${idx}].params.command`, (v) => setParam("command", v))));
            grid.appendChild(makeField("expectedStatus", makeInput("text", p.expectedStatus || "OK", `checkpoints[${idx}].params.expectedStatus`, (v) => setParam("expectedStatus", v))));
          }
          if (cp.action === "ACT_PAY_REDSTONE") {

          body.appendChild(grid);
        };

        const renderGuardsTab = (body, cp, idx) => {
          const decCard = el("div", "section-card");
          decCard.appendChild(el("strong", "", "Decorators (DEC_*)"));
          const decs = Array.isArray(cp.decorators) ? cp.decorators : [];
          for (const dId of [...SchemaConstants.ACTIVE_DECORATORS, ...SchemaConstants.DEFERRED_DECORATORS]) {
            const meta = SchemaConstants.DECORATOR_META[dId];
            const foundIdx = decs.findIndex((d) => d && d.decoratorId === dId);
            const row = el("div", "cp-row-top");
            const cb = el("input"); cb.type = "checkbox"; cb.checked = foundIdx >= 0;
            cb.setAttribute("aria-label", dId);
            cb.addEventListener("change", () => Store.mutateMission((m) => {
              const cur = Array.isArray(m.checkpoints[idx].decorators) ? [...m.checkpoints[idx].decorators] : [];
              const pos = cur.findIndex((x) => x && x.decoratorId === dId);
              if (cb.checked && pos < 0) {
                const entry = { decoratorId: dId };
                if (meta.overrideFields && meta.overrideFields.length > 0) {
                  entry.overrideParams = {};
                  for (const ofield of meta.overrideFields) entry.overrideParams[ofield.key] = ofield.defaultVal;
                }
                cur.push(entry);
              } else if (!cb.checked && pos >= 0) {
                cur.splice(pos, 1);
              }
              m.checkpoints[idx].decorators = cur;
            }));
            row.appendChild(cb);
            row.appendChild(el("span", "mono", dId));
            if (meta.deferred) row.appendChild(el("span", "badge warn", "[예약]"));
            decCard.appendChild(row);
            if (foundIdx >= 0 && meta.overrideFields && meta.overrideFields.length) {
              for (const ofield of meta.overrideFields) {
                const ov = (decs[foundIdx].overrideParams && decs[foundIdx].overrideParams[ofield.key]) ?? ofield.defaultVal;
                decCard.appendChild(makeField(`  ${ofield.label}`, makeInput("number", ov, `checkpoints[${idx}].decorators[${foundIdx}].overrideParams.${ofield.key}`, (v) => Store.mutateMission((m) => {
                  const target = m.checkpoints[idx].decorators[foundIdx];
                  target.overrideParams = target.overrideParams || {};
                  target.overrideParams[ofield.key] = Number(v);
                }))));
              }
            }
          }
          body.appendChild(decCard);

          const preCard = el("div", "section-card");
          preCard.appendChild(el("strong", "", "Preconditions (19 keys)"));
          const pre = cp.preconditions || {};
          for (const cat of Object.values(SchemaConstants.PRECONDITION_CATEGORIES)) {
            const det = el("details", "precond-group");
            det.open = cat.fields.some((f) => pre[f.key] !== undefined);
            det.appendChild(el("summary", "", cat.title));
            const fg = el("div", "form-grid");
            for (const f of cat.fields) {
              const fp = `checkpoints[${idx}].preconditions.${f.key}`;
              const val = pre[f.key];
              if (f.kind === "boolean") {
                const sel = makeSelect([{ value: "", label: "(unset)" }, { value: "true", label: "true" }, { value: "false", label: "false" }], val === undefined ? "" : String(val), fp, (v) => Store.mutateMission((m) => {
                  m.checkpoints[idx].preconditions = m.checkpoints[idx].preconditions || {};
                  if (v === "") delete m.checkpoints[idx].preconditions[f.key];
                  else m.checkpoints[idx].preconditions[f.key] = v === "true";
                }));
                fg.appendChild(makeField(f.label, sel));
              } else if (f.kind === "number") {
                fg.appendChild(makeField(f.label, makeInput("number", val ?? "", fp, (v) => Store.mutateMission((m) => {
                  m.checkpoints[idx].preconditions = m.checkpoints[idx].preconditions || {};
                  if (v === "") delete m.checkpoints[idx].preconditions[f.key];
                  else m.checkpoints[idx].preconditions[f.key] = Number(v);
                }))));
              } else if (f.kind === "list" || f.kind === "string_or_list") {
                const strVal = Array.isArray(val) ? val.join(", ") : (val || "");
                fg.appendChild(makeField(f.label, makeInput("text", strVal, fp, (v) => Store.mutateMission((m) => {
                  m.checkpoints[idx].preconditions = m.checkpoints[idx].preconditions || {};
                  const trimmed = v.trim();
                  if (!trimmed) delete m.checkpoints[idx].preconditions[f.key];
                  else if (trimmed.includes(",") || f.kind === "list") m.checkpoints[idx].preconditions[f.key] = trimmed.split(",").map((s) => s.trim()).filter(Boolean);
                  else m.checkpoints[idx].preconditions[f.key] = trimmed;
                })), true));
              } else {
                fg.appendChild(makeField(f.label, makeInput("text", val ?? "", fp, (v) => Store.mutateMission((m) => {
                  m.checkpoints[idx].preconditions = m.checkpoints[idx].preconditions || {};
                  if (!v.trim()) delete m.checkpoints[idx].preconditions[f.key];
                  else m.checkpoints[idx].preconditions[f.key] = v.trim();
                }))));
              }
            }
            det.appendChild(fg);
            preCard.appendChild(det);
          }
          body.appendChild(preCard);
        };

        const renderConditionsTab = (body, cp, idx, st) => {
          const defBox = el("div", "section-card");
          defBox.appendChild(el("strong", "", "Runtime Default Completion"));
          defBox.appendChild(el("span", "mono", DefaultResolver.describeDefaultComplete(cp, st.mission.defaults)));
          body.appendChild(defBox);

          for (const condKey of ["completeWhen", "abortWhen"]) {
            const card = el("div", "section-card");
            card.appendChild(el("strong", "", condKey));
            const cur = cp[condKey];
            const curLeaf = cur && Array.isArray(cur.conditions) && cur.conditions[0] ? cur.conditions[0] : cur;
            const curType = curLeaf && curLeaf.type ? curLeaf.type : "";
            card.appendChild(makeField("Condition Group (ALL) / Quick Leaf", makeSelect(["", ...SchemaConstants.CONDITION_TYPES], curType, `checkpoints[${idx}].${condKey}`, (t) => Store.mutateMission((m) => {
              if (!t) { delete m.checkpoints[idx][condKey]; return; }
              const node = { type: t };
              if (t === "TIMEOUT_SEC") node.timeout = 30;
              else if (t === "DURATION_SEC") node.durationSec = 10;
              else if (t === "FUEL_LEVEL_BELOW") node.threshold = 0.2;
              else if (t === "CROSS_TRACK_ERROR") node.maxDevM = 25;
              else if (t === "PAYLOAD_RESP_MATCH") node.expectedStatus = "OK";
              else if (t === "REDSTONE_INPUT_HIGH") node.side = "front";
              m.checkpoints[idx][condKey] = { logic: "ALL", conditions: [node] };
            })), true));
            if (cur) {
              const rawTa = el("textarea", "mono");
              rawTa.rows = 3;
              rawTa.value = JSON.stringify(cur, null, 2);
              rawTa.setAttribute("data-field-path", `checkpoints[${idx}].${condKey}.timeout`);
              rawTa.addEventListener("change", () => {
                try {
                  const parsed = JSON.parse(rawTa.value);
                  Store.mutateMission((m) => { m.checkpoints[idx][condKey] = parsed; });
                } catch (e) { showToast(`Invalid ${condKey} JSON: ${e.message}`, "error"); }
              });
              card.appendChild(rawTa);
            }
            body.appendChild(card);
          }
        };

        const renderHooksTab = (body, cp, idx) => {
          for (const phase of SchemaConstants.HOOK_PHASES) {
            const card = el("div", "section-card");
            const hdr = el("div", "cp-row-top");
            hdr.appendChild(el("strong", "mono", phase));
            const addBtn = el("button", "", "+ Add Hook");
            addBtn.type = "button";
            addBtn.addEventListener("click", () => Store.mutateMission((m) => {
              const arr = Array.isArray(m.checkpoints[idx][phase]) ? m.checkpoints[idx][phase] : [];
              arr.push({ type: "NOTIFY_OPERATOR", message: `${m.checkpoints[idx].checkpointId} ${phase}` });
              m.checkpoints[idx][phase] = arr;
            }));
            hdr.appendChild(addBtn);
            card.appendChild(hdr);

            const hooks = Array.isArray(cp[phase]) ? cp[phase] : [];
            for (let h = 0; h < hooks.length; h++) {
              const hk = hooks[h];
              const sub = el("div", "form-grid");
              sub.appendChild(makeField("Type", makeSelect(SchemaConstants.HOOK_TYPES, hk.type || "NOTIFY_OPERATOR", `checkpoints[${idx}].${phase}[${h}].type`, (t) => Store.mutateMission((m) => {
                const next = { type: t };
                if (t === "REDSTONE_SET") { next.side = "bottom"; next.state = true; }
                else if (t === "REDSTONE_PULSE") { next.side = "bottom"; next.durationMs = 500; }
                else if (t === "ZONE3_PAYLOAD_CMD") { next.channelOffset = 20; next.command = "CAPTURE"; }
                else next.message = "Hook triggered";
                m.checkpoints[idx][phase][h] = next;
              }))));
              if (hk.type === "NOTIFY_OPERATOR") {
                sub.appendChild(makeField("message", makeInput("text", hk.message || "", `checkpoints[${idx}].${phase}[${h}].message`, (v) => Store.mutateMission((m) => {
                  m.checkpoints[idx][phase][h].message = v;
                }))));
              } else if (hk.type === "REDSTONE_SET" || hk.type === "REDSTONE_PULSE") {
                sub.appendChild(makeField("side", makeSelect(SchemaConstants.REDSTONE_SIDES, hk.side || "bottom", `checkpoints[${idx}].${phase}[${h}].side`, (v) => Store.mutateMission((m) => {
                  m.checkpoints[idx][phase][h].side = v;
                }))));
                if (hk.type === "REDSTONE_PULSE") {
                  sub.appendChild(makeField("durationMs", makeInput("number", hk.durationMs ?? 500, `checkpoints[${idx}].${phase}[${h}].durationMs`, (v) => Store.mutateMission((m) => {
                    m.checkpoints[idx][phase][h].durationMs = Number(v);
                  }))));
                }
              } else if (hk.type === "ZONE3_PAYLOAD_CMD") {
                sub.appendChild(makeField("channelOffset (20..29)", makeInput("number", hk.channelOffset ?? 20, `checkpoints[${idx}].${phase}[${h}].channelOffset`, (v) => Store.mutateMission((m) => {
                  m.checkpoints[idx][phase][h].channelOffset = Number(v);
                }))));
                sub.appendChild(makeField("command", makeInput("text", hk.command || "", `checkpoints[${idx}].${phase}[${h}].command`, (v) => Store.mutateMission((m) => {
                  m.checkpoints[idx][phase][h].command = v;
                }))));
              }
              const rm = el("button", "btn-danger", "Remove Hook"); rm.type = "button";
              rm.addEventListener("click", () => Store.mutateMission((m) => {
                m.checkpoints[idx][phase].splice(h, 1);
              }));
              sub.appendChild(rm);
              card.appendChild(sub);
            }
            body.appendChild(card);
          }
        };

        const renderInspector = (st) => {
          const btnCp = document.getElementById("modeCheckpointBtn");
          const btnSet = document.getElementById("modeSettingsBtn");
          if (btnCp) btnCp.setAttribute("aria-pressed", String(st.ui.rightMode !== "MISSION_SETTINGS"));
          if (btnSet) btnSet.setAttribute("aria-pressed", String(st.ui.rightMode === "MISSION_SETTINGS"));
          const body = document.getElementById("inspectorBody");
          if (!body) return;
          clearNode(body);

          if (st.ui.rightMode === "MISSION_SETTINGS") {
            const m = st.mission;
            const grid = el("div", "form-grid");
            grid.appendChild(makeField("Mission ID", makeInput("text", m.missionId, "missionId", (v) => Store.mutateMission((ms) => { ms.missionId = v; })), true));
            grid.appendChild(makeField("Description", makeInput("text", m.description || "", "description", (v) => Store.mutateMission((ms) => { ms.description = v; })), true));
            grid.appendChild(makeField("Execution Mode", makeSelect(SchemaConstants.EXECUTION_MODES, m.executionMode, "executionMode", (v) => Store.mutateMission((ms) => { ms.executionMode = v; }))));
            grid.appendChild(makeField("Fallback Policy", makeSelect(SchemaConstants.FALLBACK_POLICIES, m.fallbackPolicy, "fallbackPolicy", (v) => Store.mutateMission((ms) => { ms.fallbackPolicy = v; }))));
            const defs = m.defaults || {};
            grid.appendChild(makeField("Default targetAlt (m)", makeInput("number", defs.targetAlt ?? 150, "defaults.targetAlt", (v) => Store.mutateMission((ms) => { ms.defaults.targetAlt = Number(v); }))));
            grid.appendChild(makeField("Default cruiseSpeed (m/s)", makeInput("number", defs.cruiseSpeed ?? 18, "defaults.cruiseSpeed", (v) => Store.mutateMission((ms) => { ms.defaults.cruiseSpeed = Number(v); }))));
            grid.appendChild(makeField("Default acceptanceRadius (m)", makeInput("number", defs.acceptanceRadius ?? 15, "defaults.acceptanceRadius", (v) => Store.mutateMission((ms) => { ms.defaults.acceptanceRadius = Number(v); }))));
            grid.appendChild(makeField("Default headingMode", makeSelect(SchemaConstants.HEADING_MODES, defs.headingMode || "AUTO", "defaults.headingMode", (v) => Store.mutateMission((ms) => { ms.defaults.headingMode = v; }))));
            const baseCh = DefaultResolver.computeBaseChannel(st.ui.aircraftNumber);
            grid.appendChild(makeField(`Aircraft #N (Base ${baseCh}, Zone3 ${baseCh + 20}..${baseCh + 29})`, makeInput("number", st.ui.aircraftNumber, "ui.aircraftNumber", (v) => Store.setUi({ aircraftNumber: Math.max(1, Math.min(1000, Math.floor(Number(v) || 1))) }))));
            grid.appendChild(makeField("Target Airframe (UI Preview)", makeSelect(SchemaConstants.AIRFRAME_TYPES, st.ui.targetAirframe, "ui.targetAirframe", (v) => Store.setUi({ targetAirframe: v }))));

          hdr.appendChild(makeField(`checkpointId (#${idx + 1})`, makeInput("text", cp.checkpointId, `checkpoints[${idx}].checkpointId`, (v) => Store.mutateMission((m) => { m.checkpoints[idx].checkpointId = v; }))));
          const allActions = [...Object.keys(SchemaConstants.ACTIVE_ACTIONS), ...SchemaConstants.ACTIVE_MACROS, ...Object.keys(SchemaConstants.DEFERRED_ACTIONS), ...SchemaConstants.DEFERRED_MACROS];
          if (!allActions.includes(cp.action)) allActions.unshift(cp.action);
          hdr.appendChild(makeField("Action / Macro", makeSelect(allActions, cp.action, `checkpoints[${idx}].action`, (nextAct) => Store.mutateMission((m) => {
            m.checkpoints[idx].action = nextAct;
            m.checkpoints[idx].params = MacroExpander.cleanActionSwitchParams(m.checkpoints[idx].params, nextAct);
          }))));
          body.appendChild(hdr);

          if (SchemaConstants.isMacroActive(cp.action)) {
            const macRow = el("div", "section-card");
            macRow.appendChild(el("span", "", `Macro step (${cp.action}) — click Expand Now to unfold into atomic checkpoints.`));
            const expBtn = el("button", "btn-primary", "Expand Now"); expBtn.type = "button";
            expBtn.addEventListener("click", () => Store.expandSelectedMacro(idx));
            macRow.appendChild(expBtn);
            body.appendChild(macRow);
          }

          const tabs = el("div", "inspector-tabs");
          tabs.setAttribute("role", "tablist");
          for (const tKey of ["PARAMS", "GUARDS", "CONDITIONS", "HOOKS"]) {
            const tb = el("button", "", tKey);
            tb.type = "button";
            tb.setAttribute("role", "tab");
            tb.setAttribute("aria-selected", String(st.ui.rightTab === tKey));
            tb.addEventListener("click", () => Store.setUi({ rightTab: tKey }));
            tabs.appendChild(tb);
          }
          body.appendChild(tabs);

          if (st.ui.rightTab === "PARAMS") renderParamsTab(body, cp, idx, st);
          else if (st.ui.rightTab === "GUARDS") renderGuardsTab(body, cp, idx);
          else if (st.ui.rightTab === "CONDITIONS") renderConditionsTab(body, cp, idx, st);
          else renderHooksTab(body, cp, idx);
        };

        const renderValidationBar = (st) => {
          const val = st.lastValidation || { errors: [], warnings: [] };
          const errs = val.errors || [];
          const warns = val.warnings || [];
          const sumEl = document.getElementById("validationSummary");
          if (sumEl) sumEl.textContent = `${errs.length} Errors · ${warns.length} Warnings`;
          const f = st.ui.validationFilter || "ALL";
          const bAll = document.getElementById("valFilterAll");
          const bErr = document.getElementById("valFilterErrors");
          const bWrn = document.getElementById("valFilterWarnings");
          if (bAll) bAll.setAttribute("aria-pressed", String(f === "ALL"));
          if (bErr) bErr.setAttribute("aria-pressed", String(f === "ERRORS"));
          if (bWrn) bWrn.setAttribute("aria-pressed", String(f === "WARNINGS"));

          const btnTog = document.getElementById("btnToggleValidation");
          if (btnTog) btnTog.setAttribute("aria-expanded", String(Boolean(st.ui.validationOpen)));
          const listEl = document.getElementById("validationList");
          if (!listEl) return;
          listEl.hidden = !st.ui.validationOpen;
          clearNode(listEl);
          const combined = f === "ERRORS" ? errs : (f === "WARNINGS" ? warns : [...errs, ...warns]);
          for (const issue of combined) {
            const btn = el("button", "val-issue-btn");
            btn.type = "button";
            btn.appendChild(el("span", issue.level === "ERROR" ? "badge err" : "badge warn", issue.code));
            btn.appendChild(el("span", "mono", issue.seq ? `CP#${issue.seq}` : "MISSION"));
            btn.appendChild(el("span", "", issue.message));
            btn.addEventListener("click", () => activateValidationIssue(issue));
            listEl.appendChild(btn);
          }
        };

        const renderPicker = (st) => {
          const pop = document.getElementById("actionPickerPopover");
          if (!pop) return;
          const domain = st.ui.activePopover;
          pop.hidden = !domain;
          if (!domain) return;

          const tabsEl = document.getElementById("pickerDomainTabs");
          if (tabsEl) {
            clearNode(tabsEl);
            for (const d of ["ALL", "SYS", "TKL", "NAV", "PAT", "PAY", "COM", "MOB", "FS", "MAC"]) {
              const b = el("button", "", d); b.type = "button";
              b.setAttribute("aria-selected", String(domain === d));
              b.addEventListener("click", () => Store.setUi({ activePopover: d }));
              tabsEl.appendChild(b);
            }
          }

          const listEl = document.getElementById("pickerList");
          if (!listEl) return;
          clearNode(listEl);
          const qEl = document.getElementById("pickerSearch");
          const q = (qEl && qEl.value ? qEl.value : "").trim().toLowerCase();

          const entries = [];
          for (const [id, m] of Object.entries(SchemaConstants.ACTIVE_ACTIONS)) entries.push({ id, ...m, immediate: true });
          for (const [id, m] of Object.entries(SchemaConstants.MACRO_META)) entries.push({ id, ...m, domain: "MAC", immediate: !m.deferred });
          for (const [id, m] of Object.entries(SchemaConstants.DEFERRED_ACTIONS)) entries.push({ id, ...m, immediate: false });

          for (const item of entries) {
            if (domain !== "ALL" && item.domain !== domain) continue;
            if (q && !item.id.toLowerCase().includes(q) && !(item.summary || "").toLowerCase().includes(q) && !(item.label || "").toLowerCase().includes(q)) continue;
            const btn = el("button", "picker-item"); btn.type = "button";
            const left = el("span", "mono", item.id);
            const right = el("span", item.immediate ? "badge" : "badge warn", item.immediate ? "[즉시]" : "[예약]");
            btn.appendChild(left);
            btn.appendChild(el("span", "cp-summary", item.summary || ""));
            btn.appendChild(right);
            btn.addEventListener("click", () => {
              const curIdx = Store.getState().ui.selectedIndex;
              Store.addCheckpoint(item.id, {}, curIdx >= 0 ? curIdx + 1 : undefined);
              Store.setUi({ activePopover: null });
            });
            listEl.appendChild(btn);
          }
        };

        const renderAll = () => {
          const st = Store.getState();
          renderTopBar(st);
          renderLeftRail(st);
          renderInspector(st);
          renderValidationBar(st);
          renderPicker(st);
          CanvasRenderer.render();
          if (st.ui.altProfileOpen) CanvasRenderer.renderAltProfile();
        };

        const activateValidationIssue = (issue) => {
          if (!issue) return null;
          if (Number.isInteger(issue.seq) && issue.seq >= 1) {
            CanvasRenderer.centerOnCheckpoint(issue.seq - 1);
          }
          const res = Store.focusFieldPath(issue.fieldPath || "");
          renderAll();
          if (res.fieldPath) {
            const target = document.querySelector(`[data-field-path="${res.fieldPath}"]`);
            if (target && typeof target.focus === "function") {
              target.focus();
            }
          }
          return res;
        };

        return { renderAll, showToast, activateValidationIssue };
      })();
      const JsonIO = (() => {
        const MISSION_KNOWN_KEYS = ["missionId", "version", "description", "executionMode", "fallbackPolicy", "defaults", "checkpoints"];
        const CHECKPOINT_KNOWN_KEYS = ["checkpointId", "action", "params", "preconditions", "decorators", "completeWhen", "abortWhen", "onEnter", "onExit", "onAbort", "fallbackPolicy"];
        const UI_ONLY_MISSION_KEYS = new Set(["targetAirframe", "aircraftNumber", "_extra"]);

        const PRESETS = {
          MSN_RECON_001: {
            missionId: "MSN_RECON_001",
            version: "2.0.0",
            description: "Reconnaissance orbit sortie around target zone",
            executionMode: "SINGLE",
            fallbackPolicy: "RTH",
            defaults: { cruiseSpeed: 18.0, targetAlt: 150.0, acceptanceRadius: 15.0, headingMode: "AUTO" },
            checkpoints: [
              { checkpointId: "CP_ARM", action: "ACT_SYS_ARM", params: {} },
              { checkpointId: "CP_TKOFF", action: "ACT_TKL_TAKEOFF_VERT", params: { targetAlt: 150 } },
              { checkpointId: "CP_INGRESS", action: "ACT_NAV_SPLINE_WP", params: { targetPos: { x: 240, z: -120 }, targetAlt: 160, cruiseSpeed: 20 } },
              { checkpointId: "CP_RECON_ORB", action: "ACT_PAT_LOITER_TIME", params: { targetPos: { x: 420, z: -260 }, targetAlt: 180, radius: 50, direction: "CW", durationSec: 45 }, decorators: [{ decoratorId: "DEC_SMOOTH_TRAJ" }] },
              { checkpointId: "CP_RTL", action: "ACT_FS_RTL_HOME", params: { targetAlt: 150 } },
              { checkpointId: "CP_LAND", action: "ACT_TKL_LAND_PREC", params: { facilityId: "PAD_ALPHA", targetPos: { x: 0, z: 0 } } },
            ],
          },
          MSN_TRANSIT_CORRIDOR: {
            missionId: "MSN_TRANSIT_CORRIDOR",
            version: "2.0.0",
            description: "Corridor ferry sortie",
            executionMode: "SINGLE",
            fallbackPolicy: "RTH",
            defaults: { cruiseSpeed: 22.0, targetAlt: 140.0, acceptanceRadius: 15.0, headingMode: "AUTO" },
            checkpoints: [
              { checkpointId: "CP_TKOFF", action: "ACT_TKL_TAKEOFF_VERT", params: { targetAlt: 140 } },
              { checkpointId: "CP_CORR_1", action: "ACT_NAV_CORRIDOR", params: { startPos: { x: 0, z: 0 }, endPos: { x: 600, z: 200 }, targetAlt: 140, maxCrossTrackM: 15 } },
              { checkpointId: "CP_LAND", action: "ACT_TKL_LAND_NORM", params: { targetPos: { x: 600, z: 200 } } },
            ],
          },
          MSN_PRECISION_DELIVERY: {
            missionId: "MSN_PRECISION_DELIVERY",
            version: "2.0.0",
            description: "Zone 3 payload delivery and recovery",
            executionMode: "SINGLE",
            fallbackPolicy: "HOVER_HOLD",
            defaults: { cruiseSpeed: 16.0, targetAlt: 120.0, acceptanceRadius: 10.0, headingMode: "AUTO" },
            checkpoints: [
              { checkpointId: "CP_TKOFF", action: "ACT_TKL_TAKEOFF_VERT", params: { targetAlt: 120 } },
              { checkpointId: "CP_DZ", action: "ACT_NAV_GOTO_WP", params: { targetPos: { x: 320, z: 240 }, targetAlt: 120, acceptanceRadius: 5 } },
              { checkpointId: "CP_DROP", action: "ACT_PAY_BUS_CMD", params: { channelOffset: 20, command: "DROP_CARGO", commandPayload: { bay: 1 }, waitForAck: true, expectedStatus: "OK" }, decorators: [{ decoratorId: "DEC_HUMAN_AUTH" }] },
              { checkpointId: "CP_RTL", action: "ACT_FS_RTL_HOME", params: { targetAlt: 120 } },
              { checkpointId: "CP_LAND", action: "ACT_TKL_LAND_PREC", params: { facilityId: "PAD_HOME", targetPos: { x: 0, z: 0 } } },
            ],
          },
        };

        const isNonEmptyObj = (o) => Boolean(o && typeof o === "object" && !Array.isArray(o) && Object.keys(o).length > 0);

        const cleanCheckpointForExport = (cp) => {
          const out = {
            checkpointId: cp.checkpointId || "CP",
            action: cp.action,
            params: MacroExpander.normalizeShortcutCoords(cp.params || {}),
          };
          if (isNonEmptyObj(cp.preconditions)) out.preconditions = deepClone(cp.preconditions);
          if (Array.isArray(cp.decorators) && cp.decorators.length > 0) out.decorators = deepClone(cp.decorators);
          if (isNonEmptyObj(cp.completeWhen)) out.completeWhen = deepClone(cp.completeWhen);
          if (isNonEmptyObj(cp.abortWhen)) out.abortWhen = deepClone(cp.abortWhen);
          if (Array.isArray(cp.onEnter) && cp.onEnter.length > 0) out.onEnter = deepClone(cp.onEnter);
          if (Array.isArray(cp.onExit) && cp.onExit.length > 0) out.onExit = deepClone(cp.onExit);
          if (Array.isArray(cp.onAbort) && cp.onAbort.length > 0) out.onAbort = deepClone(cp.onAbort);
          if (typeof cp.fallbackPolicy === "string" && cp.fallbackPolicy) out.fallbackPolicy = cp.fallbackPolicy;
          return MacroExpander.mergeExtras(out, cp._extra);
        };

        const buildExportObject = (mission) => {
          const m = mission && typeof mission === "object" ? mission : {};
          const out = {
            missionId: m.missionId || "MSN_NEW_001",
            version: "2.0.0",
          };
          if (typeof m.description === "string" && m.description.trim()) out.description = m.description.trim();
          out.executionMode = SchemaConstants.EXECUTION_MODES.includes(m.executionMode) ? m.executionMode : "SINGLE";
          out.fallbackPolicy = SchemaConstants.FALLBACK_POLICIES.includes(m.fallbackPolicy) ? m.fallbackPolicy : "RTH";
          if (isNonEmptyObj(m.defaults)) out.defaults = deepClone(m.defaults);
          out.checkpoints = Array.isArray(m.checkpoints) ? m.checkpoints.map(cleanCheckpointForExport) : [];
          const merged = MacroExpander.mergeExtras(out, m._extra);
          for (const uiKey of UI_ONLY_MISSION_KEYS) {
            delete merged[uiKey];
          }
          return merged;
        };

        const serializeMission = (mission) => JSON.stringify(buildExportObject(mission), null, 2);

        const parseAndNormalizeImport = (rawObj) => {
          if (!rawObj || typeof rawObj !== "object" || Array.isArray(rawObj)) {
            return { ok: false, errorCode: "INVALID_MISSION_OBJECT", message: "JSON root must be an object." };
          }
          if (Array.isArray(rawObj.items)) {
            return { ok: false, errorCode: "LEGACY_MISSION_FORMAT", message: "Legacy v1.x 'items[]' missions are rejected (Zero-Fallback)." };
          }
          const srcCps = Array.isArray(rawObj.checkpoints) ? rawObj.checkpoints : [];
          for (let i = 0; i < srcCps.length; i++) {
            const act = srcCps[i] && srcCps[i].action;
            if (SchemaConstants.isLegacyAction(act)) {
              return { ok: false, errorCode: "LEGACY_ACTION_UNSUPPORTED", message: `Legacy action '${act}' at CP#${i + 1} is forbidden.` };
            }
          }
          const missionExtras = MacroExpander.extractExtras(rawObj, MISSION_KNOWN_KEYS);
          const norm = {
            missionId: typeof rawObj.missionId === "string" && rawObj.missionId.trim() ? rawObj.missionId.trim() : "MSN_IMPORTED",
            version: "2.0.0",
            description: typeof rawObj.description === "string" ? rawObj.description : "",
            executionMode: SchemaConstants.EXECUTION_MODES.includes(rawObj.executionMode) ? rawObj.executionMode : "SINGLE",
            fallbackPolicy: SchemaConstants.FALLBACK_POLICIES.includes(rawObj.fallbackPolicy) ? rawObj.fallbackPolicy : "RTH",
            defaults: Object.assign({}, SchemaConstants.DEFAULTS_BASELINE, rawObj.defaults || {}),
            checkpoints: srcCps.map((cp, idx) => {
              const cpExtras = MacroExpander.extractExtras(cp, CHECKPOINT_KNOWN_KEYS);
              const ncp = {
                checkpointId: (cp && cp.checkpointId) || `CP_${idx + 1}`,
                action: cp && cp.action,
                params: MacroExpander.normalizeShortcutCoords((cp && cp.params) || {}),
              };
              if (cp && cp.preconditions) ncp.preconditions = deepClone(cp.preconditions);
              if (cp && Array.isArray(cp.decorators) && cp.decorators.length > 0) ncp.decorators = deepClone(cp.decorators);
              if (cp && cp.completeWhen) ncp.completeWhen = deepClone(cp.completeWhen);
              if (cp && cp.abortWhen) ncp.abortWhen = deepClone(cp.abortWhen);
              if (cp && Array.isArray(cp.onEnter) && cp.onEnter.length > 0) ncp.onEnter = deepClone(cp.onEnter);
              if (cp && Array.isArray(cp.onExit) && cp.onExit.length > 0) ncp.onExit = deepClone(cp.onExit);
              if (cp && Array.isArray(cp.onAbort) && cp.onAbort.length > 0) ncp.onAbort = deepClone(cp.onAbort);
              if (cp && cp.fallbackPolicy) ncp.fallbackPolicy = cp.fallbackPolicy;
              if (cpExtras) ncp._extra = cpExtras;
              return ncp;
            }),
          };
          if (missionExtras) norm._extra = missionExtras;
          return { ok: true, mission: norm };
        };

        const importJson = (jsonText) => {
          let parsed;
          try {
            parsed = JSON.parse(String(jsonText || ""));
          } catch (err) {
            return { ok: false, errorCode: "INVALID_JSON_SYNTAX", message: err.message };
          }
          const res = parseAndNormalizeImport(parsed);
          if (!res.ok) return res;
          Store.setMission(res.mission, { pushUndo: true, source: "import" });
          return {
            ok: true,
            mission: Store.getState().mission,
            validation: Store.getState().lastValidation,
          };
        };

        return {
          PRESETS: Object.keys(PRESETS),
          getPreset: (key) => (PRESETS[key] ? deepClone(PRESETS[key]) : null),
          buildExportObject,
          serializeMission,
          parseAndNormalizeImport,
          importJson,
        };
      })();
      const AppBootstrap = (() => {
        let initialized = false;
        let autosaveTimer = null;

        const on = (id, ev, fn) => {
          const node = document.getElementById(id);
          if (node) node.addEventListener(ev, fn);
        };

        const openActionPicker = (domain) => {
          const search = document.getElementById("pickerSearch");
          if (search) search.value = "";
          Store.setUi({ activePopover: domain || "ALL" });
          if (search && typeof search.focus === "function") search.focus();
        };

        const exportJsonFile = () => {
          const st = Store.getState();
          if (!st.lastValidation.valid) {
            InspectorUI.showToast(`Export blocked: ${st.lastValidation.errors.length} error(s). Fix before export.`, "error");
            Store.setUi({ validationOpen: true, validationFilter: "ERRORS" });
            return false;
          }
          const text = JsonIO.serializeMission(st.mission);
          const filename = `${(st.mission.missionId || "mission").replace(/[^a-zA-Z0-9_-]/g, "_")}.json`;
          if (typeof Blob !== "undefined" && typeof URL !== "undefined" && typeof URL.createObjectURL === "function") {
            const blob = new Blob([text], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            if (document.body && typeof document.body.appendChild === "function") document.body.appendChild(a);
            if (typeof a.click === "function") a.click();
            if (a.parentNode) a.parentNode.removeChild(a);
            URL.revokeObjectURL(url);
          }
          InspectorUI.showToast(`Exported ${filename}`, "info");
          return true;
        };

        const init = () => {
          if (initialized) return;
          initialized = true;

          Store.subscribe(() => {
            InspectorUI.renderAll();
            if (typeof setTimeout === "function") {
              if (autosaveTimer) clearTimeout(autosaveTimer);
              autosaveTimer = setTimeout(() => Store.saveAutosave(), 300);
            }
          });

          const mapCanvas = document.getElementById("missionCanvas");
          const altCanvas = document.getElementById("altProfileCanvas");
          if (mapCanvas || altCanvas) {
            CanvasRenderer.attach(mapCanvas, altCanvas);
          }

          on("missionIdInput", "change", (e) => Store.mutateMission((m) => { m.missionId = e.target.value.trim(); }));
          on("execModeSingle", "click", () => Store.mutateMission((m) => { m.executionMode = "SINGLE"; }));
          on("execModeRepeat", "click", () => Store.mutateMission((m) => { m.executionMode = "REPEAT"; }));
          on("btnUndo", "click", () => Store.undo());
          on("btnRedo", "click", () => Store.redo());
          on("presetSelect", "change", (e) => {
            const key = e.target.value;
            if (!key) return;
            Store.loadPreset(key);
            CanvasRenderer.fitView();
            InspectorUI.showToast(`Loaded preset ${key} (Ctrl+Z to undo)`, "info");
            e.target.value = "";
          });
          on("btnImportJson", "click", () => {
            const fi = document.getElementById("fileImportInput");
            if (fi && typeof fi.click === "function") fi.click();
          });
          on("fileImportInput", "change", (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file || typeof FileReader === "undefined") return;
            const reader = new FileReader();
            reader.onload = () => {
              const res = JsonIO.importJson(reader.result);
              if (!res.ok) InspectorUI.showToast(`${res.errorCode}: ${res.message}`, "error");
              else {
                CanvasRenderer.fitView();
                InspectorUI.showToast(`Imported ${res.mission.missionId}`, "info");
              }
            };
            reader.readAsText(file);
            e.target.value = "";
          });
          on("btnRawJson", "click", () => Store.setUi({ rawJsonOpen: !Store.getState().ui.rawJsonOpen }));
          on("btnCloseRawJson", "click", () => Store.setUi({ rawJsonOpen: false }));
          on("btnFormatJson", "click", () => {
            const ta = document.getElementById("rawJsonTextarea");
            if (!ta) return;
            try {
              ta.value = JSON.stringify(JSON.parse(ta.value), null, 2);
            } catch (err) {
              InspectorUI.showToast(`JSON syntax error: ${err.message}`, "error");
            }
          });
          on("btnApplyJson", "click", () => {
            const ta = document.getElementById("rawJsonTextarea");
            if (!ta) return;
            const res = JsonIO.importJson(ta.value);
            if (!res.ok) InspectorUI.showToast(`${res.errorCode}: ${res.message}`, "error");
            else {
              CanvasRenderer.fitView();
              InspectorUI.showToast("Applied Raw JSON (Ctrl+Z to undo)", "info");
            }
          });
          on("btnCopyJson", "click", () => {
            const text = JsonIO.serializeMission(Store.getState().mission);
            if (typeof navigator !== "undefined" && navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(() => InspectorUI.showToast("Copied AMM v2.0.0 JSON to clipboard", "info")).catch(() => {});
            }
          });
          on("btnExportJson", "click", exportJsonFile);

          on("btnOpenAddPicker", "click", () => openActionPicker("ALL"));
          on("btnOpenMacroPicker", "click", () => openActionPicker("MAC"));
          on("btnClosePicker", "click", () => Store.setUi({ activePopover: null }));
          on("pickerSearch", "input", () => InspectorUI.renderAll());
          on("btnEmptyPreset", "click", () => {
            Store.loadPreset("MSN_RECON_001");
            CanvasRenderer.fitView();
          });
          on("btnEmptyAdd", "click", () => openActionPicker("ALL"));

          on("btnToggleSnap", "click", () => Store.setUi({ gridSnap: !Store.getState().ui.gridSnap }));
          on("btnFitView", "click", () => CanvasRenderer.fitView());
          on("btnToggleAltProfile", "click", () => Store.setUi({ altProfileOpen: !Store.getState().ui.altProfileOpen }));

          on("modeCheckpointBtn", "click", () => Store.setUi({ rightMode: "CHECKPOINT" }));
          on("modeSettingsBtn", "click", () => Store.setUi({ rightMode: "MISSION_SETTINGS" }));

          on("valFilterAll", "click", () => Store.setUi({ validationFilter: "ALL", validationOpen: true }));
          on("valFilterErrors", "click", () => Store.setUi({ validationFilter: "ERRORS", validationOpen: true }));
          on("valFilterWarnings", "click", () => Store.setUi({ validationFilter: "WARNINGS", validationOpen: true }));
          on("btnToggleValidation", "click", () => Store.setUi({ validationOpen: !Store.getState().ui.validationOpen }));

          if (typeof document !== "undefined" && typeof document.addEventListener === "function") {
            document.addEventListener("keydown", (e) => {
              const tag = e.target && e.target.tagName;
              const isText = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
              if ((e.ctrlKey || e.metaKey) && !isText) {
                const k = String(e.key || "").toLowerCase();
                if (k === "z" && e.shiftKey) { if (e.preventDefault) e.preventDefault(); Store.redo(); }
                else if (k === "z") { if (e.preventDefault) e.preventDefault(); Store.undo(); }
                else if (k === "y") { if (e.preventDefault) e.preventDefault(); Store.redo(); }
              } else if (e.key === "Escape") {
                if (Store.getState().ui.activePopover) Store.setUi({ activePopover: null });
                else if (Store.getState().ui.rawJsonOpen) Store.setUi({ rawJsonOpen: false });
              }
            });
          }

          if (typeof window !== "undefined" && typeof window.addEventListener === "function") {
            window.addEventListener("resize", () => {
              CanvasRenderer.render();
              if (Store.getState().ui.altProfileOpen) CanvasRenderer.renderAltProfile();
            });
          }

          const saved = Store.loadAutosave();
          if (saved.ok && saved.mission && Array.isArray(saved.mission.checkpoints) && saved.mission.checkpoints.length > 0) {
            Store.setMission(saved.mission, { pushUndo: false, source: "autosave_restore" });
            Store.setUi({ aircraftNumber: saved.aircraftNumber, targetAirframe: saved.targetAirframe });
            InspectorUI.showToast("Restored autosaved draft", "info");
          } else {
            InspectorUI.renderAll();
          }
        };

        return { init, openActionPicker, exportJsonFile };
      })();

      window.__AMM_EDITOR__ = {
        version: "0.3.1",
        deepClone,
        SchemaConstants,
        MacroExpander,
        DefaultResolver,
        Validator,
        Store,
        CanvasRenderer,
        InspectorUI,
        JsonIO,
        AppBootstrap,
      };
      AppBootstrap.init();
    })();
  </script>
</body>
</html>
